:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161E25; --sunk:#1D272F;
  --ink:#E3EAEF; --muted:#93A5B1; --faint:#6E828F;
  --rule:#28343D; --rule-strong:#3A4A55;
  --accent:#E2808F; --accent-soft:#3A2229;
  --flag:#D9AB55; --flag-soft:#2F2716;
  --ok:#6FC79E; --ok-soft:#163025;
  --bad:#E38585; --bad-soft:#331C1C;
  --focus:#63B4DC;
}

*{box-sizing:border-box}
html{color-scheme:light dark}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.7;
  -webkit-text-size-adjust:100%;
  padding-top:var(--bar); padding-bottom:calc(var(--tabs) + 1rem);
  overscroll-behavior-y:none;
}
.wrap{max-width:41rem;margin:0 auto;padding:0 1.15rem}
.view[hidden]{display:none}

/* ---------- 상단 바 ---------- */
.bar{
  position:fixed;top:0;left:0;right:0;z-index:15;height:var(--bar);
  background:var(--surface);border-bottom:1px solid var(--rule-strong);
}
.bar-in{
  max-width:41rem;margin:0 auto;padding:0 1.15rem;height:100%;
  display:flex;align-items:center;gap:.6rem;
}
.wordmark{font-family:var(--serif);font-size:1.06rem;font-weight:600;letter-spacing:.01em}
.net{
  margin-left:auto;font-family:var(--mono);font-size:.63rem;letter-spacing:.08em;
  padding:.16rem .42rem;border-radius:2px;border:1px solid transparent;
}
.net.on{color:var(--faint)}
.net.off{color:var(--flag);border-color:var(--flag);background:var(--flag-soft)}

/* ---------- 모듈 머리 ---------- */
.modhead{padding:1.5rem 0 1rem;border-bottom:1px solid var(--rule-strong)}
.eyebrow{
  font-family:var(--mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin:0 0 .45rem;
}
.h1{font-family:var(--serif);font-weight:600;font-size:1.72rem;line-height:1.2;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:.38rem;margin:.85rem 0 0}
.tag{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.03em;
  padding:.22rem .46rem;border:1px solid var(--rule-strong);border-radius:2px;
  color:var(--muted);background:var(--surface);
}
.tag.warn{color:var(--flag);border-color:var(--flag);background:var(--flag-soft)}
.note{color:var(--muted);font-size:.84rem;margin:.9rem 0 0;line-height:1.65}

/* ---------- 조작부 ---------- */
.controls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.85rem 0 1rem;border-bottom:1px solid var(--rule)}
.sw{
  display:inline-flex;align-items:center;gap:.42rem;cursor:pointer;font-size:.8rem;color:var(--muted);
  padding:.35rem .62rem;border:1px solid var(--rule-strong);border-radius:2px;
  background:var(--surface);user-select:none;-webkit-user-select:none;
}
.sw input{accent-color:var(--accent);margin:0;width:.9rem;height:.9rem}
.spacer{flex:1}
.resume{font-family:var(--mono);font-size:.7rem;color:var(--faint)}
.loading{color:var(--faint);padding:2rem 0;font-size:.9rem}

/* ---------- 절 ---------- */
.verse{padding:1.7rem 0;border-bottom:1px solid var(--rule)}
.vnum{font-family:var(--mono);font-size:.71rem;letter-spacing:.1em;color:var(--accent);margin:0 0 .65rem;font-weight:600}
.lat{font-family:var(--serif);font-size:1.34rem;line-height:1.82;letter-spacing:.004em;margin:0 0 1rem}
.pn{color:var(--faint)}
.w{
  font:inherit;color:inherit;background:none;border:0;padding:.05em .04em;margin:0;
  cursor:pointer;border-bottom:1px solid transparent;border-radius:2px;
}
.w:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.w.on{background:var(--accent-soft);border-bottom-color:var(--accent)}
.w.flagged{border-bottom:1px dotted var(--flag)}
.lv{font:inherit;font-weight:inherit;font-style:inherit;color:inherit}
body.lv-on .lv{color:var(--accent)}

/* ---------- 접이식 ---------- */
.rows{display:flex;flex-direction:column;gap:.42rem}
details{background:var(--surface);border:1px solid var(--rule);border-radius:3px}
details[open]{border-color:var(--rule-strong)}
summary{
  cursor:pointer;padding:.55rem .75rem;font-size:.79rem;color:var(--muted);
  list-style:none;display:flex;align-items:center;gap:.5rem;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;color:var(--faint);font-family:var(--mono)}
details[open] summary::after{content:"\2212"}
summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.k{font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.body{padding:0 .75rem .8rem;font-size:.89rem}
.tr{margin:0 0 .5rem}
.tr:last-child{margin-bottom:0}
.lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:.1rem}

/* ---------- 질문 ---------- */
.q{border-top:1px solid var(--rule);padding:.6rem 0}
.q:first-child{border-top:0;padding-top:.2rem}
.q button{
  font:inherit;text-align:left;background:none;border:0;padding:0;margin:0;color:var(--ink);
  cursor:pointer;width:100%;font-size:.88rem;line-height:1.6;display:flex;gap:.5rem;
}
.q button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.q .n{font-family:var(--mono);font-size:.71rem;color:var(--accent);flex:none;padding-top:.18rem}
.q .a{display:none;margin:.5rem 0 .1rem 1.45rem;padding-left:.8rem;border-left:2px solid var(--accent-soft);color:var(--muted);font-size:.85rem;line-height:1.72}
.q.open .a{display:block}

/* ---------- 이문 장치 ---------- */
.app{font-size:.82rem;color:var(--muted);line-height:1.68}
.app .item{padding:.5rem 0;border-top:1px solid var(--rule)}
.app .item:first-child{border-top:0;padding-top:.1rem}
.app .hd{display:flex;gap:.45rem;align-items:baseline;margin-bottom:.15rem;flex-wrap:wrap}
.app .kind{font-family:var(--mono);font-size:.59rem;letter-spacing:.08em;text-transform:uppercase;color:var(--flag);border:1px solid var(--flag);border-radius:2px;padding:.05rem .3rem}
.app .sfx{font-family:var(--serif);font-size:1rem;color:var(--ink)}
.app .conf{font-family:var(--mono);font-size:.59rem;color:var(--faint);letter-spacing:.06em}
.app .opts{margin:.28rem 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:.3rem}
.app .opts li{font-family:var(--serif);font-size:.92rem;background:var(--sunk);padding:.1rem .42rem;border-radius:2px;color:var(--ink)}
.app .opts li.pick{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cit .ref{font-family:var(--mono);font-size:.71rem;color:var(--accent);letter-spacing:.05em}
.cit .par{font-family:var(--serif);font-size:.97rem;color:var(--ink);background:var(--sunk);padding:.45rem .6rem;border-radius:2px;margin:.35rem 0 0;overflow-x:auto}

/* ---------- 단어 시트 ---------- */
#sheet{
  position:fixed;left:0;right:0;bottom:var(--tabs);z-index:20;
  background:var(--surface);border-top:2px solid var(--accent);
  box-shadow:0 -10px 30px rgba(0,0,0,.14);
  transform:translateY(calc(100% + var(--tabs)));transition:transform .18s ease;
  padding:.9rem 1.15rem 1.1rem;
}
#sheet.up{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
#sheet .inner{max-width:41rem;margin:0 auto}
#sheet .top{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.5rem}
#sheet .sf{font-family:var(--serif);font-size:1.6rem;line-height:1.1}
#sheet .lemma{font-family:var(--serif);font-size:.94rem;color:var(--muted)}
#sheet .x{
  margin-left:auto;flex:none;white-space:nowrap;
  font-family:var(--mono);font-size:.78rem;background:none;
  border:1px solid var(--rule-strong);color:var(--muted);cursor:pointer;border-radius:2px;padding:.12rem .45rem;
}
#sheet .lemma{min-width:0}
#sheet .top{flex-wrap:wrap}
#sheet .x:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#sheet dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem .8rem;margin:0;font-size:.86rem}
#sheet dt{font-family:var(--mono);font-size:.61rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding-top:.28rem}
#sheet dd{margin:0;line-height:1.6}
#sheet .warn{margin:.6rem 0 0;font-size:.78rem;color:var(--flag);background:var(--flag-soft);border-radius:2px;padding:.4rem .55rem}

/* ---------- 탭 ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:25;height:var(--tabs);
  display:flex;background:var(--surface);border-top:1px solid var(--rule-strong);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tab{
  flex:1;font:inherit;font-size:.82rem;background:none;border:0;color:var(--muted);
  cursor:pointer;border-top:2px solid transparent;margin-top:-1px;
}
.tab.on{color:var(--accent);border-top-color:var(--accent);font-weight:600}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:-3px}

/* ---------- 상태 화면 ---------- */
.h2{font-family:var(--serif);font-size:1.5rem;font-weight:600;margin:1.7rem 0 .5rem}
.h3{font-family:var(--serif);font-size:1.12rem;font-weight:600;margin:1.8rem 0 .5rem}
.lede{color:var(--muted);font-size:.87rem;margin:0 0 1.2rem;line-height:1.7}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
.checks li{
  display:flex;align-items:flex-start;gap:.6rem;background:var(--surface);
  border:1px solid var(--rule);border-radius:3px;padding:.65rem .75rem;
}
.checks .dot{
  flex:none;width:.62rem;height:.62rem;border-radius:50%;margin-top:.42rem;background:var(--faint);
}
.checks li.ok .dot{background:var(--ok)}
.checks li.bad .dot{background:var(--bad)}
.checks .t{font-size:.87rem;font-weight:500}
.checks .d{font-size:.78rem;color:var(--muted);line-height:1.6;margin-top:.1rem}
.checks li.ok .t{color:var(--ok)}
.checks li.bad .t{color:var(--bad)}
.actions{display:flex;gap:.5rem;margin:1.1rem 0 0;flex-wrap:wrap}
.btn{
  font:inherit;font-size:.83rem;padding:.5rem .9rem;border-radius:2px;cursor:pointer;
  background:var(--surface);border:1px solid var(--rule-strong);color:var(--ink);
}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#1A1013}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.files{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:.73rem;color:var(--muted)}
.files li{padding:.28rem 0;border-bottom:1px solid var(--rule);word-break:break-all}
.files li:last-child{border-bottom:0}
.danger{margin:2.2rem 0 0;padding:.9rem;border:1px solid var(--rule-strong);border-radius:3px;background:var(--sunk)}
.danger p{font-size:.8rem;color:var(--muted);margin:.2rem 0 .7rem}
.danger .h3{margin-top:0}

.foot{padding:1.8rem 0 1rem;color:var(--faint);font-size:.75rem;line-height:1.7}
.foot code{font-family:var(--mono);font-size:.71rem}

</style>
</head>

ist","used_by":["루터 (1519년 2판으로 1522년 독일어 신약 번역)"],"pd":true,"digital_text":"partial","note_ko":"라틴 열이 불가타가 아니라 에라스무스 자신의 새 번역이다. poenitentiam agite → resipiscite 같은 번역 선택이 곧바로 신학 논쟁이 되었다."},{"id":"pagninus","title":"파니누스 라틴어 성경 (Sanctes Pagninus)","year":"1528","language":"la","testament":"both","tradition":"humanist","used_by":["16세기 히브리어 학자 전반"],"pd":true,"digital_text":"scans_only","note_ko":"히에로니무스 이후 원어에서 옮긴 첫 라틴어 완역. 매우 직역적이라 후대 라틴어 번역의 기준이 되었다."},{"id":"beza","title":"베자 라틴어 신약 (Theodorus Beza)","year":"1556–1604","language":"la","testament":"nt","tradition":"reformed","used_by":["뚤레틴","에임스","오웬","웨스트민스터 총회"],"pd":true,"digital_text":"partial","note_ko":"개혁파의 표준 라틴어 신약. 주석이 특히 영향력이 컸고 제네바 성경과 KJV의 바탕이 되었다."},{"id":"jt","title":"유니우스–트레멜리우스 라틴어 구약","year":"1575–1579","language":"la","testament":"ot","tradition":"reformed","used_by":["뚤레틴","에임스","오웬","웨스트민스터 총회"],"pd":true,"digital_text":"scans_only","note_ko":"개혁파 스콜라주의가 라틴어로 구약을 인용할 때의 사실상 표준. 베자 신약과 합본으로 유통되었다. 5단계(뚤레틴) 진입 전까지 OCR 부채."},{"id":"tr","title":"Textus Receptus (스테파누스 / 엘제비르)","year":"1550 / 1633","language":"grc","testament":"nt","tradition":"neutral","used_by":["개혁파 전반","오웬 (1659년에 그 순수성을 변호)"],"pd":true,"digital_text":"good","note_ko":"스테파누스 1550년판이 표준. 1551년판에서 절 번호가 도입되었다. textus receptus라는 이름은 엘제비르 1633년판 서문에서 왔다."},{"id":"lxx","title":"칠십인역 (Septuaginta)","year":"—","language":"grc","testament":"ot","tradition":"neutral","used_by":["신약 저자들"],"pd":true,"digital_text":"good","note_ko":"신약의 구약 인용은 대개 이쪽을 따른다. 불가타 구약(히브리어에서 번역)과 자구가 어긋나는 원인."},{"id":"mt","title":"마소라 본문 (봄베르크 랍비 성경 2판)","year":"1524–1525","language":"hbo","testament":"ot","tradition":"neutral","used_by":["개혁파 전반"],"pd":true,"digital_text":"partial","note_ko":"야콥 벤 하임 편집. 이후 수백 년간 표준 히브리어 본문. 원판 자체는 스캔뿐이나 계승 텍스트는 전자화되어 있다."},{"id":"author","title":"저자 자신의 번역","year":"—","language":"la","testament":"both","tradition":"neutral","used_by":[],"pd":true,"digital_text":"none","note_ko":"오웬처럼 원어에서 직접 옮겨 인용하는 경우. 어느 인쇄판과도 일치하지 않는다."}],"sentences":[{"id":"mk-1-1","text_id":"vulgate-mark-1","latin":"Initium evangeliī Iēsū Chrīstī, Fīliī Deī.","order":1,"period":"vulgate","tradition":"neutral","translation_ko":"하나님의 아들 예수 그리스도의 복음의 시작.","translation_free_ko":"하나님의 아들 예수 그리스도에 관한 복음은 여기서 시작된다.","ref":"Mc 1,1","verified":false,"uncertain":[{"id":"u-mk1-1-01","kind":"vowel_length","token_index":1,"surface":"evangeliī","issue":"첫 음절 e의 길이. 그리스어 εὐαγγέλιον의 eu는 이중모음이므로 고전 표기 euangelium에서는 첫 음절이 장음이다. 중세 이후 v로 적으면서 e가 독립 단음절이 되었다. 어느 쪽을 앱의 표준으로 삼을지 미정.","options":["evangeliī (e 단음, 중세 표기 기준)","euangeliī (eu 이중모음, 고전 표기 기준)"],"chosen":"evangeliī","confidence":"low","resolve_by":"Latin Macronizer 출력 대조 + Lewis & Short 표제어(euangelium) 확인 후 프로젝트 전체 표기 정책으로 확정"},{"id":"u-mk1-1-02","kind":"vowel_length","token_index":3,"surface":"Chrīstī","issue":"그리스어 Χριστός의 ι는 단음이나, 라틴 기독교 시가에서는 일관되게 장음으로 스캔된다(Chrīstus).","options":["Chrīstī (라틴 시가 관행)","Christī (그리스어 어원 기준)"],"chosen":"Chrīstī","confidence":"medium","resolve_by":"프루덴티우스 등 기독교 시가 스캔 예시로 확정"},{"id":"u-mk1-1-03","kind":"parsing","token_index":2,"surface":"Iēsū","issue":"evangeliī에 걸리는 소유격이 주어적 소유격인지 목적어적 소유격인지. '예수께서 전하신 복음'과 '예수에 관한 복음'이 갈린다.","options":["목적어적 소유격 (예수에 관한 복음)","주어적 소유격 (예수께서 전하신 복음)","양쪽을 겸하는 의도적 중의"],"chosen":"목적어적 소유격","confidence":"medium","resolve_by":"해석 문제이므로 확정하지 말고 질문 은행에서 양쪽을 제시할 것"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-2","text_id":"vulgate-mark-1","latin":"Sīcut scrīptum est in Isaiā prophētā: Ecce ego mittō angelum meum ante faciem tuam, quī praeparābit viam tuam ante tē.","order":2,"period":"vulgate","tradition":"neutral","translation_ko":"이사야 예언자 안에 기록되어 있는 것과 같이: 보라, 내가 네 얼굴 앞에 내 사자를 보낸다. 그가 네 앞에서 네 길을 예비할 것이다.","translation_free_ko":"예언자 이사야의 글에 기록된 그대로다. \"보아라, 내가 너보다 앞서 내 사자를 보낸다. 그가 네 길을 닦아 놓을 것이다.\"","ref":"Mc 1,2","verified":false,"uncertain":[{"id":"u-mk1-2-01","kind":"text","token_index":null,"surface":"ego / ante tē","issue":"클레멘스 불가타에는 ego와 문말 ante tē가 있으나 슈투트가르트 비평판에는 둘 다 없다. 또 슈투트가르트는 Esaia로 적는다.","options":["클레멘스 본문 (ego, ante tē 포함)","슈투트가르트 본문 (둘 다 없음)"],"chosen":"클레멘스 본문","confidence":"medium","resolve_by":"모듈 전체의 저본을 하나로 확정할 것. 저본이 바뀌면 토큰 인덱스가 전부 밀린다."},{"id":"u-mk1-2-02","kind":"vowel_length","token_index":4,"surface":"Isaiā","issue":"히브리어 기원 고유명사의 모음 길이는 라틴 사전에 확정 표제가 없다. 탈격 어미 -ā만 확실하다.","options":["Isaiā","Īsaiā","Isaīā"],"chosen":"Isaiā","confidence":"low","resolve_by":"SPEC 5장의 보조 표제어 사전에 성경 고유명사 항목을 신설하고 일괄 결정"},{"id":"u-mk1-2-03","kind":"text","token_index":4,"surface":"Isaiā prophētā","issue":"인용 출처 표기의 이문. 라틴어 전통(클레멘스·슈투트가르트 모두)은 '이사야 예언자 안에'로 읽지만, Textus Receptus 계열 그리스어는 '예언자들 안에'(ἐν τοῖς προφήταις)로 읽고 KJV도 그렇게 옮긴다. 실제 인용문은 말라기와 출애굽기의 결합이므로 복수형이 사실관계에 더 맞고, 단수형이 더 어려운 독법이다. 이 모듈이 학습자에게 가르치는 라틴어 본문은 오웬이 변호한 Textus Receptus와 이 자리에서 갈린다.","options":["in Isaiā prophētā (라틴어 전통)","in prophētīs (Textus Receptus 계열에 맞춘 독법)"],"chosen":"in Isaiā prophētā (라틴어 전통)","confidence":"medium","resolve_by":"저본이 클레멘스판이므로 라틴어 독법을 따른다. 다만 이 어긋남 자체를 질문 은행 항목으로 노출할 것 — 판본 문제를 학습자가 처음 만나는 자리로 적합하다."}],"source_version":"vg-clem","greek":null},{"id":"mk-1-3","text_id":"vulgate-mark-1","latin":"Vōx clāmantis in dēsertō: Parāte viam Dominī, rēctās facite sēmitās eius.","order":3,"period":"vulgate","tradition":"neutral","translation_ko":"광야에서 외치는 자의 소리: 주의 길을 예비하라, 그의 지름길들을 곧게 만들라.","translation_free_ko":"광야에서 외치는 소리가 있다. \"주님의 길을 마련하여라. 그분이 다니실 길을 곧게 내어라.\"","ref":"Mc 1,3","verified":false,"uncertain":[{"id":"u-mk1-3-01","kind":"parsing","token_index":3,"surface":"in dēsertō","issue":"구두점이 원문에 없다. in dēsertō를 clāmantis에 붙이면 '광야에서 외치는 자의 소리', Parāte에 붙이면 '외치는 자의 소리: 광야에서 주의 길을 예비하라'가 된다. 히브리어 원문(이사야 40:3)의 대구 구조는 후자를 지지하고, 그리스어 칠십인역과 불가타의 어순은 전자로 읽히게 만든다.","options":["clāmantis에 소속 (전통적 독법)","Parāte에 소속 (히브리어 대구 기준)"],"chosen":"clāmantis에 소속","confidence":"medium","resolve_by":"해석 문제이므로 확정하지 말 것. 질문 은행 항목으로 노출한다."}],"source_version":"vg-clem","greek":null},{"id":"mk-1-4","text_id":"vulgate-mark-1","latin":"Fuit Iōhannēs in dēsertō baptizāns, et praedicāns baptismum paenitentiae in remissiōnem peccātōrum.","order":4,"period":"vulgate","tradition":"neutral","translation_ko":"요한이 광야에서 세례를 주며, 죄들의 사함에 이르는 회개의 세례를 선포하며 있었다.","translation_free_ko":"요한이 광야에 나타나 세례를 주면서, 죄를 용서받게 하는 회개의 세례를 선포하였다.","ref":"Mc 1,4","verified":false,"uncertain":[{"id":"u-mk1-4-01","kind":"vowel_length","token_index":1,"surface":"Iōhannēs","issue":"그리스어 Ἰωάννης의 ω를 장음 ō로 잡았다. 다만 라틴 표기가 Ioannes / Iohannes / Joannes로 갈리고(클레멘스판은 Joannes), h가 있는 형태의 음절 구조도 확정적이지 않다.","options":["Iōhannēs (슈투트가르트 철자 + 그리스어 ω 반영)","Iōannēs (h 없음)","Iohannēs (첫 음절 단음)"],"chosen":"Iōhannēs","confidence":"low","resolve_by":"SPEC 5장 보조 표제어 사전에 성경 고유명사 항목을 신설하고 모듈 전체에 일괄 적용"},{"id":"u-mk1-4-02","kind":"orthography","token_index":8,"surface":"paenitentiae","issue":"클레멘스 불가타는 poenitentiae로 적는다. 고전 철자 paenitentia로 정규화했으나 ae와 oe는 발음이 다르므로(SPEC 7장 고전 발음 채택) 표기 정책 확정이 필요하다.","options":["paenitentiae (고전 철자로 정규화)","poenitentiae (클레멘스 철자 유지)"],"chosen":"paenitentiae","confidence":"medium","resolve_by":"모듈 전체 철자 정규화 규칙을 문서화하고 일괄 적용"},{"id":"u-mk1-4-03","kind":"lemma","token_index":7,"surface":"baptismum","issue":"이 형태는 baptismus(2변화 남성)의 대격일 수도, baptisma(3변화 중성, 대격 baptisma)와 병존하는 이형일 수도 있다. 불가타는 두 표제어를 모두 쓴다.","options":["baptismus, -ī (2변화 남성)","baptisma, -atis (3변화 중성)"],"chosen":"baptismus, -ī (2변화 남성)","confidence":"medium","resolve_by":"불가타 전체 용례를 검색해 형태 분포로 결정"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-5","text_id":"vulgate-mark-1","latin":"Et ēgrediēbātur ad eum omnis Iūdaeae regiō, et Ierosolymītae ūniversī, et baptizābantur ab illō in Iordānis flūmine, cōnfitentēs peccāta sua.","order":5,"period":"vulgate","tradition":"neutral","translation_ko":"그리고 온 유대 지방과 예루살렘 사람 전체가 그에게로 나아가고 있었고, 자기들의 죄를 고백하면서 그에게 요단 강에서 세례를 받고 있었다.","translation_free_ko":"온 유대 지방과 예루살렘 사람들이 모두 그에게 나아와, 자기 죄를 고백하며 요단 강에서 그에게 세례를 받았다.","ref":"Mc 1,5","verified":false,"uncertain":[{"id":"u-mk1-5-01","kind":"vowel_length","token_index":8,"surface":"Ierosolymītae","issue":"그리스어 접미사 -ίτης의 ι가 장음이므로 -ītae로 tionary 대조"},{"id":"u-mk1-6-03","kind":"vowel_length","token_index":13,"surface":"locustās","issue":"음절 무게는 st 때문에 어느 쪽이든 중음절이지만, 모음 자체의 길이(locusta / locūsta)가 확정되지 않았다. 고전 발음 IPA 산출에는 영향이 있다.","options":["locustās (u 단음)","locūstās (u 장음)"],"chosen":"locustās","confidence":"low","resolve_by":"사전 대조. IPA 계산 함수의 입력이 되므로 확정 필요"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-7","text_id":"vulgate-mark-1","latin":"Et praedicābat, dīcēns: Venit fortior post mē, cuius nōn sum dignus prōcumbēns solvere corrigiam calceāmentōrum eius.","order":7,"period":"vulgate","tradition":"neutral","translation_ko":"그리고 그는 선포하고 있었다, 말하기를: 나보다 더 강한 이가 내 뒤에 온다. 나는 몸을 굽혀 그의 신발의 끈을 푸는 것도 합당하지 않다.","translation_free_ko":"그는 이렇게 선포하였다. \"나보다 더 힘센 분이 내 뒤에 오신다. 나는 몸을 굽혀 그분의 신발 끈을 풀어 드릴 자격조차 없다.\"","ref":"Mc 1,7","verified":false,"uncertain":[{"id":"u-mk1-7-01","kind":"vowel_length","token_index":3,"surface":"Venit","issue":"철자만으로는 현재 venit와 완료 vēnit가 구별되지 않는다. 그리스어 원문 ἔρχεται가 현재이므로 현재로 잡았다. 9절의 vēnit(그리스어 ἦλθεν, 아오리스트)와 정반대이므로 두 절을 함께 검증해야 한다.","options":["venit (직설법 현재)","vēnit (직설법 완료)"],"chosen":"venit (직설법 현재)","confidence":"medium","resolve_by":"그리스어 대조는 마쳤으나 라틴 주석 전통 확인 필요. SPEC 7장이 지목한 venit/vēnit 사례이므로 검증 우선순위 최상"},{"id":"u-mk1-7-02","kind":"parsing","token_index":7,"surface":"cuius","issue":"cuius를 calceāmentōrum을 한정하는 소유격으로 보았다(뒤의 eius가 같은 대상을 중복 지시하는 셈어법). dignus가 소유격을 지배한다고 보는 독법도 있으나 dignus는 본래 탈격을 지배하므로 채택하지 않았다.","options":["calceāmentōrum을 한정하는 관계대명사 소유격","dignus가 지배하는 소유격"],"chosen":"calceāmentōrum을 한정하는 관계대명사 소유격","confidence":"medium","resolve_by":"그리스어 οὗ ... αὐτοῦ 구조 및 Allen & Greenough의 dignus 항목 대조"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-8","text_id":"vulgate-mark-1","latin":"Ego baptizāvī vōs aquā, ille vērō baptizābit vōs Spīritū Sānctō.","order":8,"period":"vulgate","tradition":"neutral","translation_ko":"나는 물로 너희에게 세례를 주었다. 그러나 그는 성령으로 너희에게 세례를 줄 것이다.","translation_free_ko":"나는 너희에게 물로 세례를 주었지만, 그분은 성령으로 세례를 주실 것이다.","ref":"Mc 1,8","verified":false,"uncertain":[{"id":"u-mk1-8-01","kind":"parsing","token_index":8,"surface":"Spīritū Sānctō","issue":"aquā와 병렬하는 수단탈격으로 잡았다. 다만 신학적으로는 성령을 단순한 도구로 보는 독해에 이견이 있어, 어떤 주석 전통은 이를 영역·영향권을 나타내는 탈격으로 읽는다.","options":["수단탈격 (aquā와 병렬)","영역을 나타내는 탈격"],"chosen":"수단탈격","confidence":"medium","resolve_by":"문법적으로는 수단탈격이 자연스럽다. 신학적 함의는 3c층 어휘 작업에서 별도로 다룰 것"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-9","text_id":"vulgate-mark-1","latin":"Et factum est: in diēbus illīs vēnit Iēsūs ā Nazareth Galilaeae, et baptizātus est ā Iōhanne in Iordāne.","order":9,"period":"vulgate","tradition":"neutral","translation_ko":"그리고 이런 일이 있었다: 그 날들에 예수께서 갈릴래아의 나사렛으로부터 오셨고, 요단에서 요한에게 세례를 받으셨다.","translation_free_ko":"그 무렵에 예수께서 갈릴래아 나사렛에서 오셔서, 요단 강에서 요한에게 세례를 받으셨다.","ref":"Mc 1,9","verified":false,"uncertain":[{"id":"u-mk1-9-01","kind":"vowel_length","token_index":6,"surface":"vēnit","issue":"그리스어 ἦλθεν(아오리스트)에 대응하므로 완료 vēnit로 잡았다. 7절의 venit(현재)와 철자가 같으므로 두 절을 반드시 함께 검증해야 한다.","options":["vēnit (직설법 완료)","venit (직설법 현재)"],"chosen":"vēnit (직설법 완료)","confidence":"medium","resolve_by":"7절 항목과 묶어서 함께 확정"},{"id":"u-mk1-9-02","kind":"vowel_length","token_index":9,"surface":"Nazareth","issue":"히브리어 기원의 무변화 고유명사로 라틴어 모음 길이가 확정되지 않는다. 마크론을 하나도 붙이지 않았다.","options":["Nazareth (마크론 없음)","Nazarēth"],"chosen":"Nazareth","confidence":"low","resolve_by":"보조 표제어 사전에서 무변화 성경 지명 처리 규칙과 함께 확정. IPA 계산 함수에서 예외 처리 필요"},{"id":"u-mk1-9-03","kind":"parsing","token_index":10,"surface":"Galilaeae","issue":"-ae 어미는 소유격 단수·여격 단수·주격 복수가 모두 같다. Nazareth를 한정하는 소유격으로 잡았다.","options":["소유격 단수 (Nazareth를 한정)","여격 단수","주격 복수"],"chosen":"소유격 단수","confidence":"medium","resolve_by":"의미상 소유격이 확실하나, -ae 중의성은 학습 항목으로 노출할 가치가 있어 질문 은행에 포함함"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-10","text_id":"vulgate-mark-1","latin":"Et statim ascendēns dē aquā, vīdit caelōs apertōs, et Spīritum tamquam columbam dēscendentem, et manentem in ipsō.","order":10,"period":"vulgate","tradition":"neutral","translation_ko":"그리고 즉시 물에서 올라오면서, 열린 하늘들과, 비둘기처럼 내려와 자기 위에 머무르는 성령을 보았다.","translation_free_ko":"그리고 물에서 올라오시자마자, 하늘이 갈라지고 성령이 비둘기처럼 자기에게 내려오는 것을 보셨다.","ref":"Mc 1,10","verified":false,"uncertain":[{"id":"u-mk1-10-01","kind":"text","token_index":6,"surface":"caelōs apertōs","issue":"클레멘스판은 vidit caelos apertos, 슈투트가르트판은 vidit apertos caelos로 어순이 다르다. 뜻은 같으나 토큰 인덱스가 달라진다.","options":["caelōs apertōs (클레멘스)","apertōs caelōs (슈투트가르트)"],"chosen":"caelōs apertōs (클레멘스)","confidence":"medium","resolve_by":"모듈 저본 확정과 함께 처리"},{"id":"u-mk1-10-02","kind":"parsing","token_index":7,"surface":"apertōs","issue":"caelōs를 단순 수식하는지('열린 하늘들을 보았다'), 서술 대격인지('하늘들이 열린 것을 보았다')가 갈린다. vīdit류 지각동사는 서술 대격을 흔히 취한다.","options":["서술 대격","단순 수식"],"chosen":"서술 대격","confidence":"medium","resolve_by":"그리스어 σχιζομένους τοὺς οὐρανούς 구조 대조"},{"id":"u-mk1-10-03","kind":"vowel_length","token_index":5,"surface":"vīdit","issue":"완료 vīdit와 현재 videt는 철자가 다르나(vidit / videt) 필사본에서 e/i 혼동이 잦다. 완료로 잡았다.","options":["vīdit (직설법 완료)","videt (직설법 현재)"],"chosen":"vīdit (직설법 완료)","confidence":"medium","resolve_by":"그리스어 εἶδεν(아오리스트) 대조로 완료가 유력. 마크론 위치만 재확인"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-11","text_id":"vulgate-mark-1","latin":"Et vōx facta est dē caelīs: Tū es Fīlius meus dīlēctus, in tē complacuī.","order":11,"period":"vulgate","tradition":"neutral","translation_ko":"그리고 하늘들로부터 소리가 있었다: 너는 내 사랑하는 아들이다, 네 안에서 내가 기뻐하였다.","translation_free_ko":"그리고 하늘에서 소리가 들려왔다. \"너는 내 사랑하는 아들이다. 내가 너를 기뻐한다.\"","ref":"Mc 1,11","verified":false,"uncertain":[{"id":"u-mk1-11-01","kind":"parsing","token_index":13,"surface":"complacuī","issue":"완료형인데 한국어로는 현재처럼 옮기는 것이 자연스럽다. 그리스어 εὐδόκησα(아오리스트)를 그대로 완료로 옮긴 것이며, 셈어 배경에서는 지속되는 상태를 뜻한다. 시제를 문자대로 '기뻐하였다'로 굳힐지, 상태로 풀지 결정이 필요하다.","options":["완료로 직역 (기뻐하였다)","상태로 의역 (기뻐한다)"],"chosen":"직역은 완료, 의역은 현재로 갈라 둠","confidence":"medium","resolve_by":"번역 정책 문서를 만들 때 일괄 결정. 아오리스트 완료 대응은 불가타 전체에 걸린 문제다"},{"id":"u-mk1-11-02","kind":"parsing","token_index":11,"surface":"in tē","issue":"complaceō는 고전 라틴어에서 여격을 지배한다(mihi complacet). 여기 in + 탈격은 그리스어 ἐν σοί의 직역이다.","options":["셈어법 직역으로 처리","고전 용법으로 재분석"],"chosen":"셈어법 직역으로 처리","confidence":"medium","resolve_by":"Allen & Greenough의 complaceō 항목 및 불가타 용례 대조"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-12","text_id":"vulgate-mark-1","latin":"Et statim Spīritus expulit eum in dēsertum.","order":12,"period":"vulgate","tradition":"neutral","translation_ko":"그리고 즉시 영이 그를 광야로 내몰았다.","translation_free_ko":"그리고 곧바로 성령이 그를 광야로 내보내셨다.","ref":"Mc 1,12","verified":false,"uncertain":[],"source_version":"vg-clem","greek":null},{"id":"mk-1-13","text_id":"vulgate-mark-1","latin":"Et erat in dēsertō quadrāgintā diēbus et quadrāgintā noctibus: et tentābātur ā Satanā: eratque cum bēstiīs, et angelī ministrābant illī.","order":13,"period":"vulgate","tradition":"neutral","translation_ko":"그리고 광야에서 사십 일과 사십 밤 동안 있었다. 그리고 사탄에게 시험을 받고 있었다. 그리고 들짐승들과 함께 있었고, 천사들이 그를 섬기고 있었다.","translation_free_ko":"광야에서 사십 일 밤낮을 지내며 사탄에게 시험을 받으셨다. 들짐승과 함께 계셨고, 천사들이 시중을 들었다.","ref":"Mc 1,13","verified":false,"uncertain":[{"id":"u-mk1-13-01","kind":"parsing","token_index":5,"surface":"quadrāgintā diēbus","issue":"기간을 나타내는데 탈격이다. 고전 라틴어는 기간에 대격을 쓴다(quadrāgintā diēs). 후기 라틴어에서 시간탈격이 기간까지 떠맡는 현상이거나, 그리스어 여격 구문의 직역이다.","options":["시간탈격 (후기 용법으로 기간을 포함)","대격으로 교정할 이문 존재 여부 확인"],"chosen":"시간탈격","confidence":"medium","resolve_by":"불가타 다른 기간 표현과 대조. 고전 문법과 어긋나므로 학습자에게 반드시 설명해야 하는 자리다"},{"id":"u-mk1-13-02","kind":"orthography","token_index":10,"surface":"tentābātur","issue":"클레멘스판은 tentabatur, 고전 철자는 temptō(temptābātur)다. 앞서 paenitentia에 적용한 고전 철자 정규화를 여기에도 적용할지 일관성 문제가 걸린다.","options":["tentābātur (클레멘스 철자 유지)","temptābātur (고전 철자로 정규화)"],"chosen":"tentābātur","confidence":"low","resolve_by":"모듈 전체 철자 정규화 규칙에 이 항목을 명시할 것. 지금은 두 방침이 섞여 있다"},{"id":"u-mk1-13-03","kind":"vowel_length","token_index":12,"surface":"Satanā","issue":"그리스어 Σατανᾶς에서 온 1변화 남성 고유명사. 탈격 어미 -ā만 확실하고 앞 모음들은 미확정이다.","options":["Satanā","Sātanā","Satānā"],"chosen":"Satanā","confidence":"low","resolve_by":"보조 표제어 사전의 성경 고유명사 항목에서 일괄 결정"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-14","text_id":"vulgate-mark-1","latin":"Postquam autem trāditus est Iōhannēs, vēnit Iēsūs in Galilaeam, praedicāns Evangelium rēgnī Deī,","order":14,"period":"vulgate","tradition":"neutral","translation_ko":"그런데 요한이 넘겨진 뒤에, 예수께서 갈릴래아로 오셔서, 하나님 나라의 복음을 선포하셨다,","translation_free_ko":"요한이 잡힌 뒤에 예수께서 갈릴래아로 가시어 하나님 나라의 복음을 선포하셨다.","ref":"Mc 1,14","verified":false,"uncertain":[{"id":"u-mk1-14-01","kind":"parsing","token_index":2,"surface":"trāditus est","issue":"'넘겨졌다'가 직역이나 문맥상 '체포되었다'를 뜻한다. trādō는 이후 수난 서사에서 '넘기다'로 반복되는 핵심어라, 직역을 살릴지 문맥 의미를 취할지가 어휘 카드 설계에 영향을 준다.","options":["직역 유지 (넘겨지다)","문맥 의미 채택 (체포되다)"],"chosen":"직역은 '넘겨지다', 의역은 '잡히다'로 분리","confidence":"medium","resolve_by":"trādō를 3b층 어휘로 올릴지 검토. 마가복음 전체에서 반복되는 주제어다"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-15","text_id":"vulgate-mark-1","latin":"et dīcēns: Quoniam implētum est tempus, et appropinquāvit rēgnum Deī: paenitēminī, et crēdite Evangeliō.","order":15,"period":"vulgate","tradition":"neutral","translation_ko":"그리고 말하기를: 때가 채워졌고, 하나님의 나라가 가까이 왔다. 회개하라, 그리고 복음을 믿으라.","translation_free_ko":"\"때가 찼고 하나님 나라가 다가왔다. 회개하고 복음을 믿어라.\"","ref":"Mc 1,15","verified":false,"uncertain":[{"id":"u-mk1-15-01","kind":"orthography","token_index":10,"surface":"paenitēminī","issue":"클레멘스판은 poenitemini다. 4절의 paenitentia와 같은 정규화를 적용했다. 다만 이 단어는 단순한 철자 문제가 아니다 — 에라스무스가 그리스어 μετανοεῖτε를 불가타의 poenitentiam agite(고해를 행하라)가 아니라 resipiscite(정신을 차려라)로 옮긴 것이 종교개혁 논쟁의 출발점 가운데 하나였다. 판본이 곧 신학인 자리다.","options":["paenitēminī (고전 철자)","poenitēminī (클레멘스 철자)","resipīscite (에라스무스 번역)"],"chosen":"paenitēminī","confidence":"medium","resolve_by":"철자는 정규화 규칙으로, 번역 논쟁은 3c층 어휘 카드로 따로 다룰 것. paenitentia를 3c 충돌 어휘에 올릴 후보로 표시한다"},{"id":"u-mk1-15-02","kind":"parsing","token_index":10,"surface":"paenitēminī","issue":"형태는 수동 명령법 2인칭 복수다. paeniteō는 고전에서 주로 비인칭(paenitet mē)으로 쓰이는데, 여기서는 디포넌트처럼 인칭 활용을 한다. 후기 라틴어의 변화다.","options":["디포넌트로 처리","수동태 명령으로 처리","비인칭의 인칭화로 주석"],"chosen":"디포넌트로 처리","confidence":"medium","resolve_by":"Whitaker's WORDS 파싱 대조 및 불가타 용례 확인"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-16","text_id":"vulgate-mark-1","latin":"Et praeteriēns secus mare Galilaeae, vīdit Simōnem, et Andrēam frātrem eius, mittentēs rētia in mare (erant enim piscātōrēs),","order":16,"period":"vulgate","tradition":"neutral","translation_ko":"그리고 갈릴래아 바다를 따라 지나가시다가, 시몬과 그의 형제 안드레아가 바다에 그물들을 던지고 있는 것을 보셨다 (그들은 어부였기 때문이다),","translation_free_ko":"갈릴래아 호숫가를 지나시다가 시몬과 그 동생 안드레아가 호수에 그물을 던지는 것을 보셨다. 그들은 어부였다.","ref":"Mc 1,16","verified":false,"uncertain":[{"id":"u-mk1-16-01","kind":"vowel_length","token_index":6,"surface":"Simōnem","issue":"그리스어 Σίμων에서 온 3변화 고유명사. -ōn- 어간의 장음은 관행을 따랐으나 확정 표제가 없다. Andrēam(Ἀνδρέας)도 같은 문제다.","options":["Simōnem / Andrēam","Simonem / Andream"],"chosen":"Simōnem / Andrēam","confidence":"low","resolve_by":"보조 표제어 사전의 성경 고유명사 항목에서 일괄 결정"},{"id":"u-mk1-16-02","kind":"parsing","token_index":2,"surface":"secus","issue":"여기서는 대격을 지배하는 전치사('~을 따라')다. 다만 secus는 부사('달리')와 명사(sexus의 이형)로도 쓰여 표제어 판별이 필요하다.","options":["전치사 (+대격)","부사"],"chosen":"전치사 (+대격)","confidence":"medium","resolve_by":"Lewis & Short의 secus 항목 대조"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-17","text_id":"vulgate-mark-1","latin":"et dīxit eīs Iēsūs: Venīte post mē, et faciam vōs fierī piscātōrēs hominum.","order":17,"period":"vulgate","tradition":"neutral","translation_ko":"그리고 예수께서 그들에게 말씀하셨다: 내 뒤로 오라, 그러면 내가 너희를 사람들의 어부가 되게 만들겠다.","translation_free_ko":"예수께서 그들에게 말씀하셨다. \"나를 따라오너라. 내가 너희를 사람 낚는 어부로 만들겠다.\"","ref":"Mc 1,17","verified":false,"uncertain":[{"id":"u-mk1-17-01","kind":"parsing","token_index":11,"surface":"piscātōrēs","issue":"vōs를 서술하는 대격 보어로 보았다. fierī의 보어이므로 주격 piscātōrēs가 아니라 대격이어야 하는데, 형태가 같아 구별되지 않는다.","options":["대격 (vōs를 서술)","주격으로 재분석"],"chosen":"대격","confidence":"medium","resolve_by":"faciō + 대격부정법 구조의 보어 격 규칙을 문법서에서 확인"}],"source_version":"vg-clem","greek":null},{"id":"mk-1-18","text_id":"vulga ","syntax_role":"secūtī와 결합한 조동사","greek_align":null,"greek_lemma":null},{"sentence_id":"mk-1-20","index":15,"surface":"eum","lemma_id":"lem:is","morph":"대격 단수 남성 (지시대명사)","syntax_role":"직접목적어","greek_align":null,"greek_lemma":null}],"scripture_citations":[{"id":"cit-mk-1-2-01","sentence_id":"mk-1-2","token_range":[6,19],"ref":"Mal 3,1 + Ex 23,20","source_version":"lxx","verbatim":false,"divergence_ko":"두 구절의 결합이다. '내 사자를 보낸다'는 Mal 3,1에서, '네 얼굴 앞에'는 Ex 23,20에서 왔다. 결정적 변개는 인칭이다 — Mal 3,1에서 하나님은 '내 얼굴 앞에'(ante faciem meam) 길을 예비한다고 하는데, 마가는 '네 얼굴 앞에'(ante faciem tuam)로 바꿔 메시아를 향한 말로 돌린다. 문법 문제가 아니라 신학적 재적용이다.","vulgate_parallel":"불가타 Mal 3,1: Ecce ego mitto angelum meum, et praeparabit viam ante faciem meam. — 불가타 구약은 히브리어에서, 마가복음은 그리스어에서 옮겼으므로 같은 구절이 라틴어로 두 번, 서로 다르게 나타난다.","polemical":false,"verified":false},{"id":"cit-mk-1-3-01","sentence_id":"mk-1-3","token_range":[0,10],"ref":"Is 40,3","source_version":"lxx","verbatim":false,"divergence_ko":"불가타 이사야서에는 in solitudine(광야에서)가 한 번 더 들어가고 마지막이 Dei nostri(우리 하나님의)인데, 마가는 그 자리를 eius(그의)로 줄였다. 구두점 문제(in dēsertō가 어디에 붙는가)도 여기서 갈린다.","vulgate_parallel":"불가타 Is 40,3: Vox clamantis in deserto: Parate viam Domini, rectas facite in solitudine semitas Dei nostri.","polemical":false,"verified":false}],"question_banks":[{"sentence_id":"mk-1-1","items":[{"q_ko":"이 문장에는 정동사가 하나도 없다. 어떻게 읽어야 하는가?","a_ko":"책의 표제(標題)이기 때문이다. Initium이 주격으로 홀로 서서 '~의 시작'이라는 제목 구실을 한다. 정동사를 찾으려 하지 말고 '여기서부터가 ~의 시작이다'로 읽는다. 마가복음 전체의 제목 줄이다."},{"q_ko":"Iēsū는 무슨 형태인가? 왜 2변화 소유격 -ī가 아닌가?","a_ko":"소유격 단수다. Iēsūs는 그리스어 Ἰησοῦς를 그대로 받아들인 이름이라 라틴어 5변화 어느 쪽에도 들어가지 않는다. 소유격·여격·탈격이 모두 Iēsū 한 형태이고, 대격만 Iēsum, 주격만 Iēsūs다. 형태로는 격을 못 가리고 문맥으로 판단해야 한다."},{"q_ko":"소유격이 evangeliī – Iēsū – Chrīstī – Fīliī – Deī로 다섯 개나 이어진다. 각각 무엇에 걸리는가?","a_ko":"evangeliī는 Initium에, Iēsū는 evangeliī에, Chrīstī는 Iēsū와 동격, Fīliī는 Iēsū Chrīstī 전체와 동격, Deī는 Fīliī에 걸린다. 즉 사슬 세 마디(Initium ← evangeliī ← Iēsū)에 동격 두 개가 얹힌 구조다. 소유격이 줄줄이 나오면 먼저 '동격'인지 '한정'인지부터 갈라야 한다."},{"q_ko":"evangeliī Iēsū Chrīstī는 '예수께서 전하신 복음'인가, '예수에 관한 복음'인가?","a_ko":"형태만으로는 결정되지 않는다. 주어적 소유격으로 보면 앞의 뜻, 목적어적 소유격으로 보면 뒤의 뜻이다. 마가복음은 예수의 생애를 서술하는 책이므로 목적어적 소유격으로 읽는 것이 다수설이나, 저자가 양쪽을 겸하도록 썼다는 견해도 있다. 이 항목은 확정하지 않는다."},{"q_ko":"Fīliī Deī는 무엇과 동격인가? Chrīstī와만 동격일 수는 없는가?","a_ko":"Iēsū Chrīstī 전체와 동격이다. 셋 다 소유격 단수 남성이라 형태로는 구별되지 않지만, 의미상 '예수 그리스도 = 하나님의 아들'이므로 이름 전체를 받는다."},{"q_ko":"Initium이 주격인 것은 어떻게 아는가? 대격일 수는 없는가?","a_ko":"2변화 중성이므로 주격과 대격의 형태가 같아 형태로는 구별되지 않는다. 그러나 지배할 동사도 전치사도 없으므로 대격일 근거가 없고, 표제 주격으로 읽는다. 중성 명사에서 주격·대격 동형은 항상 이런 식으로 문맥이 결정한다."},{"q_ko":"evangelium은 어디서 온 단어인가?","a_ko":"그리스어 εὐαγγέλιον(좋은 소식)의 음차다. 라틴어 고유 어휘가 아니므로 고전 라틴어 어원 분석이 통하지 않고, 첫 음절 e의 길이도 표기 전통에 따라 갈린다. 신약 라틴어에는 이런 그리스어 차용어가 많다."}]},{"sentence_id":"mk-1-2","items":[{"q_ko":"scrīptum est는 어느 시제·태인가? 왜 두 단어인가?","a_ko":"완료 수동 3인칭 단수다. 라틴어의 완료 계열 수동은 언제나 '완료수동분사(PPP) + sum'의 두 단어로 만든다. scrībō의 PPP scrīptus에 est가 붙었다. 한 단어짜리 수동 어미를 찾으면 안 된다."},{"q_ko":"scrīptum이 중성인 이유는? 무엇에 성을 맞췄는가?","a_ko":"맞출 주어가 없기 때문이다. '기록되어 있다'는 비인칭 표현이라 성을 결정할 명사가 없고, 이럴 때 라틴어는 중성 단수를 쓴다. 뒤의 인용문 전체가 막연한 주어 노릇을 한다."},{"q_ko":"라틴어는 인칭대명사를 보통 생략하는데, ego가 왜 명시되었는가?","a_ko":"강조 때문이다. mittō의 어미 -ō만으로 1인칭 단수는 이미 확정되므로 ego는 문법상 불필요하다. 굳이 쓰면 '다른 누구도 아닌 내가'라는 대조가 생긴다. 히브리어 원문의 강조 대명사를 옮긴 것이기도 하다."},{"q_ko":"quī의 선행사는 무엇인가? 성·수·격은 각각 어디서 오는가?","a_ko":"선행사는 angelum이다. 관계대명사는 성과 수를 선행사에서(남성 단수), 격은 자기가 속한 관계절 안에서의 역할로부터(praeparābit의 주어이므로 주격) 가져온다. 이 두 출처를 나눠 보는 것이 관계대명사 독해의 전부다."},{"q_ko":"in Isaiā prophētā가 탈격인 이유는? in이 대격을 지배할 때와 어떻게 다른가?","a_ko":"정지된 위치를 나타내므로 탈격이다. in + 탈격은 '~ 안에(서)', in + 대격은 '~ 안으로(향하여)'다. 여기서는 이사야서라는 문헌 '안에' 기록되어 있다는 뜻이므로 탈격이다. 4절의 in remissiōnem과 대조해 보라."},{"q_ko":"prophētā는 -a로 끝나는 1변화인데 왜 남성인가?","a_ko":"그리스어 -της로 끝나는 남성 명사를 라틴어 1변화로 받아들였기 때문이다. nauta, agricola, poēta와 같은 부류다. 형태는 1변화지만 수식하는 형용사는 남성 형태를 써야 한다. 사전 표제어에 예외 표시가 필요한 단어다."},{"q_ko":"ante faciem tuam을 직역하면 '네 얼굴 앞에'다. 무슨 뜻인가?","a_ko":"히브리어 관용구 לִפְנֵי(~의 얼굴 앞에 = ~보다 앞서)를 그대로 옮긴 것이다. 라틴어 자체의 표현이 아니라 번역체다. 불가타에는 이런 히브리어 직역 관용구가 자주 나오므로 라틴어 문법으로만 풀려 하지 말고 셈어 관용구를 의심해야 한다."},{"q_ko":"praeparābit의 시제는? -bit는 어느 변화 동사의 표지인가?","a_ko":"미래다. -bō/-bis/-bit 계열의 미래 어미는 1변화·2변화 동사에만 쓰인다. praeparō는 1변화이므로 여기에 해당한다. 3변화·4변화 동사는 -am/-ēs/-et 계열을 쓰므로, -bit를 보면 곧바로 1변화나 2변화로 좁힐 수 있다."},{"q_ko":"마가는 이 인용을 '이사야 예언자 안에'라고 밝히는데, 실제로는 말라기와 출애굽기가 섞여 있다. 라틴어 본문은 이 문제를 어떻게 처리하는가?","a_ko":"처리하지 않는다. 클레멘스판과 슈투트가르트판 모두 in Isaia propheta(단수)로 읽는다. 반면 Textus Receptus 계열 그리스어는 '예언자들 안에'(복수)로 읽고 KJV도 그렇게 옮긴다. 인용 내용을 보면 복수형이 사실관계에 맞으므로, 단수형은 필사자가 고치기 어려운 쪽, 곧 더 원본에 가까운 독법으로 평가된다. 흥미로운 점은 이 자리에서 여러분이 배우는 라틴어 본문이 오웬이 그 순수성을 변호한 Textus Receptus와 갈린다는 것이다. '성경 한 권'이 아니라 여러 본문 전통이 있다는 사실을 처음 만나는 자리다."}]},{"sentence_id":"mk-1-3","items":[{"q_ko":"clāmantis는 무슨 형태이며 왜 소유격인가?","a_ko":"현재능동분사의 소유격 단수다. 분사가 명사처럼 쓰여 '외치는 자'를 뜻하고, 그것이 Vōx를 한정하는 소유격으로 놓였다. 분사는 형용사이므로 이렇게 단독 명사 노릇을 할 수 있다."},{"q_ko":"Vōx clāmantis의 소유격은 주어적인가 목적어적인가?","a_ko":"주어적 소유격이다. '외치는 자가 내는 소리'이므로 clāmantis가 vōx라는 행위의 주체다. 만약 목적어적이라면 '외치는 자를 향한 소리'가 되어 말이 되지 않는다."},{"q_ko":"in dēsertō는 clāmantis에 붙는가, Parāte에 붙는가? 뜻이 어떻게 달라지는가?","a_ko":"원문에 구두점이 없어 확정되지 않는다. clāmantis에 붙이면 '광야에서 외치는 자의 소리'가 되어 외치는 장소가 광야이고, Parāte에 붙이면 '외치는 자의 소리: 광야에서 주의 길을 예비하라'가 되어 길을 닦는 장소가 광야다. 이사야 40:3의 히브리어 대구 구조는 후자를 지지하지만, 복음서 저자들은 전자로 읽어 세례 요한에게 적용했다. 이 문장은 마크론이 아니라 구두점이 뜻을 가르는 사례다."},{"q_ko":"rēctās는 sēmitās를 그냥 수식하는가?","a_ko":"아니다. 서술 대격이다. '이미 곧은 지름길들을 만들라'가 아니라 '지름길들을 곧게 만들라'는 뜻이다. facite류 동사는 '목적어 + 서술 대격'을 취해 '~을 ~한 상태로 만들다'를 나타낸다. 어순(rēctās facite sēmitās)이 보어를 앞으로 끌어내 강조하고 있다."},{"q_ko":"Parāte와 facite는 각각 몇 변화 동사인가? 어미만으로 구별되는가?","a_ko":"Parāte는 1변화(parō, parāre), facite는 3-io변화(faciō, facere)다. 명령법 2인칭 복수 어미는 어간모음에 -te를 붙인 것이므로 어간모음이 곧 단서다. -āte면 1변화, -ite면 3변화나 3-io변화, -ēte면 2변화, -īte면 4변화다."},{"q_ko":"faciō가 3-io변화라는 것은 어떻게 아는가?","a_ko":"1인칭 단수가 -iō로 끝나는데 부정사가 -ere(단음 e)이기 때문이다. 4변화라면 부정사가 -īre여야 한다. faciō, facere가 그래서 3-io변화다. 명령법 단수 fac은 추가로 불규칙(어미 -e 탈락)이라 따로 외워야 한다."},{"q_ko":"eius를 쓰고 suās를 쓰지 않은 이유는?","a_ko":"sēmitās의 소유자가 문장의 주어가 아니기 때문이다. 재귀 소유형용사 suus는 소유자가 그 절의 주어일 때만 쓴다. 여기서 명령의 주어는 '너희'이고 지름길의 소유자는 Dominus이므로 재귀가 아닌 eius를 쓴다. 6절의 lumbōs eius도 같은 원리다."},{"q_ko":"Vōx는 3변화 명사인데 주격에 어미가 보이지 않는다. 어간을 어떻게 찾는가?","a_ko":"소유격 vōcis에서 어미 -is를 떼면 어간 vōc-이 나온다. 3변화 명사는 주격이 어간을 감추므로 반드시 소유격을 함께 외워야 한다. vōx는 어간 vōc-에 주격 -s가 붙어 c+s가 x로 합쳐진 형태다."}]},{"sentence_id":"mk-1-4","items":[{"q_ko":"Fuit ... baptizāns는 왜 단순히 baptizābat가 아닌가?","a_ko":"sum + 현재능동분사의 우언적 표현이다. 그리스어 원문의 ἐγένετο ... βαπτίζων 구조를 직역한 것으로, 라틴어 고유 어법이라기보다 번역체다. 뜻은 '세례를 주는 자로 나타났다 / 세례를 주고 있었다'로, 지속되는 활동을 부각한다. 불가타에서 sum + 분사 조합이 보이면 그리스어 우언법의 직역을 의심하라."},{"q_ko":"Fuit는 어떤 동사의 어떤 형태인가?","a_ko":"sum의 직설법 완료 능동 3인칭 단수다. sum은 불규칙 동사이며 완료 어간은 fu-로 현재 어간(es-/s-)과 전혀 다르다. fuī, fuistī, fuit로 이어지는 완료 계열은 통째로 외워야 한다."},{"q_ko":"baptizāns와 praedicāns가 주격 단수 남성인 근거는?","a_ko":"주어 Iōhannēs와 성·수·격을 일치시켰기 때문이다. 분사는 형용사이므로 자기가 서술하는 명사에 맞춘다. 만약 -antem이었다면 대격이 되어 다른 명사를 수식하게 된다. 분사를 만나면 먼저 어미로 격을 읽고 그 격에 맞는 명사를 찾는 순서로 처리한다."},{"q_ko":"in remissiōnem은 왜 탈격이 아니라 대격인가?","a_ko":"in + 대격은 방향·목적·귀결을 나타내기 때문이다. 회개의 세례가 '죄 사함이라는 결과를 향하여' 주어진다는 뜻이다. 2절의 in Isaiā prophētā(탈격, 정지된 위치)와 비교하면 같은 in의 두 얼굴이 선명해진다."},{"q_ko":"baptismum paenitentiae의 소유격은 어떤 종류인가?","a_ko":"성질 소유격으로 보는 것이 무난하다. '회개라는 성격을 지닌 세례'라는 뜻이다. 목적어적 소유격('회개를 낳는 세례')으로 읽는 견해도 있으며, 이 차이는 신학적으로 작지 않다. 3c층 어휘와 마주칠 때 소유격의 종류가 전통을 가르는 일이 잦다."},{"q_ko":"remissiōnem peccātōrum의 소유격은?","a_ko":"목적어적 소유격이다. remissiō는 remittō(놓아주다)의 명사형이므로 '죄들을 놓아줌'이 된다. 즉 peccāta가 remittō의 목적어에 해당한다. 동사에서 온 명사 뒤의 소유격은 먼저 주어적인지 목적어적인지를 물어야 한다."},{"q_ko":"remissiō peccātōrum은 사도신경에도 나온다. 형태는 어떻게 달라지는가?","a_ko":"사도신경에서는 crēdō ... remissiōnem peccātōrum으로 crēdō의 목적어가 되어 대격이다. 여기서는 in의 목적어라서 역시 대격이지만 이유가 다르다. 같은 어구라도 문장 안의 역할이 격을 결정한다는 점을 확인하기 좋은 대조다."},{"q_ko":"dēsertum은 원래 무슨 형태였는가?","a_ko":"dēserō(버리다)의 완료수동분사 dēsertus의 중성 단수형이 명사로 굳은 것이다. 직역하면 '버려진 것'이고, 여기서 '광야'라는 뜻이 나왔다. 분사가 명사로 굳는 현상은 라틴어에 흔하므로 낯선 -tum, -sum 명사를 만나면 원 동사를 찾아보는 습관을 들이라."}]},{"sentence_id":"mk-1-5","items":[{"q_ko":"주어가 regiō와 Ierosolymītae 둘인데 ēgrediēbātur는 왜 단수인가?","a_ko":"가장 가까운 주어 하나에만 수를 맞추는 어법이다. 동사가 주어들보다 앞에 놓이면 라틴어는 첫 번째 주어에 맞추는 일이 흔하다. 실제로 뒤의 baptizābantur는 두 주어를 다 받아 복수가 되었다. 같은 문장 안에서 단수와 복수가 나란히 나오는 것이 그 증거다."},{"q_ko":"ēgrediēbātur는 수동 어미인데 왜 능동으로 번역하는가?","a_ko":"ēgredior가 디포넌트 동사이기 때문이다. 형태는 수동, 뜻은 능동이다. 이런 동사는 수동 어미를 보고도 수동으로 옮기면 안 된다. 사전에 ēgredior, ēgredī, ēgressus sum처럼 1인칭이 -or로 끝나면 디포넌트다."},{"q_ko":"ēgredior는 몇 변화 동사인가?","a_ko":"3-io변화다. gradior(걷다)에 접두사 ē-가 붙은 것이고, gradior는 1인칭이 -ior인데 부정사가 -ī(gradī)로 짧아 4변화가 아니라 3-io변화로 분류된다. 미완료 어미가 -iēbātur가 되는 것도 3-io변화의 특징이다."},{"q_ko":"ab illō와 in Iordānis flūmine는 둘 다 탈격이다. 무엇이 다른가?","a_ko":"ab illō는 행위자탈격으로 수동태의 동작 주체를 가리키고, in flūmine는 장소탈격으로 사건이 일어난 곳을 가리킨다. 행위자탈격은 사람일 때 반드시 ā/ab를 붙이고, 사물이면 전치사 없이 수단탈격으로 쓴다. 8절의 aquā가 바로 그 전치사 없는 수단탈격이다."},{"q_ko":"미완료를 두 번(ēgrediēbātur, baptizābantur) 쓴 효과는?","a_ko":"한 번 일어난 사건이 아니라 되풀이되고 이어지던 상황을 그린다. 사람들이 계속 나아왔고 계속 세례를 받고 있었다는 뜻이다. 완료였다면 한 시점의 사건으로 끝난다. 서사 배경을 까는 자리에서 미완료가 쓰인 전형적인 예다."},{"q_ko":"cōnfitentēs는 디포넌트 동사의 분사인데 형태가 능동이다. 모순 아닌가?","a_ko":"모순이 아니다. 디포넌트 동사도 현재분사와 미래능동분사만은 능동형을 쓴다. 수동형이 없기 때문이 아니라, 이 두 분사에는 애초에 수동형 자체가 존재하지 않는다. 반대로 완료수동분사(cōnfessus)는 형태가 수동인데 뜻은 능동이라 또 뒤집힌다."},{"q_ko":"peccāta sua에서 왜 eius가 아니라 sua인가?","a_ko":"죄의 주인이 그 절의 주어(나아온 사람들)이기 때문이다. 재귀 소유형용사 suus는 소유자가 주어와 같을 때 쓴다. 만약 eōrum이었다면 제3자의 죄를 고백한다는 뜻이 된다. 3절의 sēmitās eius, 6절의 lumbōs eius와 정확히 반대 경우다."},{"q_ko":"omnis Iūdaeae regiō의 어순은 왜 이런가?","a_ko":"omnis는 regiō를 수식하고 Iūdaeae는 regiō를 한정하는데, 수식어가 피수식어를 앞뒤로 감싸는 대신 앞에 몰려 있다. 라틴어 어순은 자유롭지만 성·수·격 일치가 짝을 알려준다. omnis는 주격 단수 여성이므로 소유격 Iūdaeae가 아니라 주격 regiō에 걸린다는 것이 형태로 확정된다."},{"q_ko":"Iordānis flūmine의 소유격은 어떤 종류인가?","a_ko":"동격적 소유격이다. 강과 요단은 같은 대상이므로 '요단의 강'이 아니라 '요단이라는 강'으로 옮긴다. urbs Rōmae 같은 표현과 같은 부류다."}]},{"sentence_id":"mk-1-6","items":[{"q_ko":"erat vestītus는 과거완료 수동인가?","a_ko":"아니다. 형태만 보면 sum의 미완료 + 완료수동분사이므로 과거완료 수동으로 읽을 수 있지만, 여기서는 '옷 입혀져 있었다'는 지속된 상태를 서술한다. vestītus가 사실상 형용사처럼 굳어 주격보어로 기능하는 자리다. 이런 구별은 문맥으로만 가려진다."},{"q_ko":"pilīs는 어떤 탈격 용법인가?","a_ko":"수단탈격이다. 무엇으로 옷 입혀졌는가를 나타낸다. 사물이므로 전치사가 붙지 않는다. 5절의 ab illō(사람이므로 ab 필수)와 나란히 놓고 보면 규칙이 분명해진다."},{"q_ko":"zōnā pellīceā는 탈격인가 주격인가? 판단이 왜 중요한가?","a_ko":"확정되지 않았다. 탈격으로 읽으면 pilīs와 병렬하여 vestītus에 걸리고('낙타털과 가죽 띠로 옷 입혀져'), 주격으로 읽으면 erat를 다시 취하는 별개의 서술이 된다('가죽 띠가 그의 허리에 있었다'). 마크론 없이 zona pellicea로 적으면 두 독법이 구별되지 않으므로, 마크론을 붙이는 순간 파싱을 결정해 버리는 셈이다. 이 프로젝트에서 마크론 부여가 곧 해석 작업인 이유가 여기 있다."},{"q_ko":"lumbōs eius에서 suōs를 썼다면 뜻이 어떻게 달라지는가?","a_ko":"재귀형이므로 주어인 요한 자신의 허리가 되어 뜻은 사실상 같아진다. 그럼에도 eius를 쓴 것은 그리스어 원문 αὐτοῦ를 그대로 옮긴 번역체 때문이다. 불가타에서 재귀 규칙이 느슨해지는 대목을 확인해 두면 이후 독해가 편해진다."},{"q_ko":"mel의 격은 무엇이며 어떻게 아는가?","a_ko":"대격 단수다. mel은 3변화 중성이라 주격과 대격이 같지만, edēbat의 목적어 자리이고 앞의 locustās와 et로 병렬되므로 대격으로 확정된다. 중성 명사는 형태가 아니라 문장 내 역할로 격을 정한다."},{"q_ko":"silvestre가 -e로 끝나는 이유는?","a_ko":"3변화 형용사의 중성 단수 주격·대격 어미가 -e이기 때문이다. silvester, silvestris, silvestre의 세 형태 중 중성 단수형이며, 중성 명사 mel에 맞춘 것이다. 남성이었다면 silvestrem이 된다."},{"q_ko":"edō는 어떤 동사인가?","a_ko":"불규칙 동사다. edō, edere(또는 ēsse), ēdī, ēsus로 규칙형과 불규칙형이 병존한다. 다만 여기 나온 미완료 edēbat는 규칙형이라 어렵지 않다. sum, possum, eō, ferō, volō, nōlō, mālō, fīō와 함께 불규칙으로 분류해 외운다."},{"q_ko":"edēbat와 ēdit는 무엇이 다른가?","a_ko":"edēbat는 미완료로 '먹고 있었다, 늘 먹었다'는 반복·지속을, ēdit는 완료로 '먹었다'는 한 번의 사건을 나타낸다. 이 절은 요한의 평소 생활 방식을 그리므로 미완료라야 한다. 6절 전체가 미완료로 배경을 깔고 있다."},{"q_ko":"camēlus와 camēlī 중 어느 쪽이 표제어인가?","a_ko":"camēlus가 표제어이고 camēlī는 소유격 단수다. 다만 형태만으로는 소유격 단수와 주격 복수가 같으므로 구별해야 한다. 여기서는 pilīs를 한정하므로 소유격이다."}]},{"sentence_id":"mk-1-7","items":[{"q_ko":"Venit인가 Vēnit인가? 마크론 하나가 무엇을 바꾸는가?","a_ko":"여기서는 현재 venit다. 마크론이 없으면 직설법 현재 3인칭 단수, 있으면 직설법 완료 3인칭 단수가 되어 '온다'와 '왔다'가 갈린다. 이 구절은 앞으로 오실 분을 예고하는 대목이므로 현재라야 하고, 그리스어 원문도 현재(ἔρχεται)다. 9절의 vēnit와 나란히 놓고 외워 두면 좋다. 라틴어에서 모음 길이가 순수하게 문법을 가르는 대표 사례다."},{"q_ko":"fortior는 형용사인데 왜 주어 노릇을 하는가?","a_ko":"형용사가 명사처럼 단독으로 쓰였기 때문이다. '더 강한 [사람]'으로 읽으면 된다. 라틴어는 성·수·격이 어미에 드러나므로 명사를 생략해도 무엇을 가리키는지 알 수 있어 이런 용법이 자유롭다. 남성 단수이므로 '더 강한 남자 한 사람'이다."},{"q_ko":"fortior의 원급과 최상급은?","a_ko":"원급 fortis, 비교급 fortior(중성 fortius), 최상급 fortissimus다. 비교급 어미 -ior는 3변화로 변화하고, 최상급 -issimus는 1·2변화로 변화한다. 비교급만 변화 방식이 달라진다는 점을 놓치기 쉽다."},{"q_ko":"dignus는 보통 어떤 격을 지배하는가? cuius가 dignus에 딸리는가?","a_ko":"dignus는 본래 탈격을 지배한다(dignus laude). 따라서 소유격 cuius는 dignus의 지배를 받는 것이 아니라 뒤의 calceāmentōrum을 한정한다고 보아야 한다. 형용사가 어떤 격을 지배하는지 미리 알아 두면 이런 오배치를 피할 수 있다."},{"q_ko":"cuius와 eius가 같은 사람을 가리킨다. 왜 두 번 나오는가?","a_ko":"그리스어 원문의 οὗ ... αὐτοῦ 구조를 그대로 옮긴 셈어법이다. 히브리어와 아람어는 관계사 뒤에 대명사를 한 번 더 놓아 관계를 명확히 하는데, 그리스어를 거쳐 라틴어까지 그 중복이 남았다. 고전 라틴어라면 cuius 하나로 끝냈을 것이다. 라틴어 문법으로는 잉여이므로 번역할 때 하나만 살린다."},{"q_ko":"solvere는 어떤 부정사 용법인가?","a_ko":"dignus를 한정하는 설명적 부정사다. '무엇을 하기에 합당한가'를 밝힌다. 고전 라틴어라면 dignus quī solvat(관계절 + 가정법)를 쓰는 편이 더 흔하지만, 후기 라틴어와 성경 라틴어에서는 부정사로 대신하는 일이 늘어난다."},{"q_ko":"prōcumbēns는 언제의 동작인가?","a_ko":"주동사와 같은 시점이다. 현재능동분사는 절대적 현재가 아니라 주동사에 대한 동시성을 나타낸다. 여기서 주절이 현재(sum)이므로 '몸을 굽히면서'가 된다. 만약 주동사가 완료였다면 '몸을 굽히고 있던 때에'로 옮겨진다."},{"q_ko":"post mē는 시간인가 장소인가?","a_ko":"시간이다. '내 뒤에 오신다'는 공간적 위치가 아니라 '나보다 나중에 오신다'는 순서를 뜻한다. post는 두 가지를 모두 나타낼 수 있으므로 문맥이 결정한다."},{"q_ko":"praedicābat, dīcēns는 왜 겹쳐 쓰였는가?","a_ko":"'선포하며 말하기를'로 직역되는 셈어식 중복 표현이다. 히브리어에서 발화 동사 뒤에 '말하기를'을 덧붙여 직접화법을 여는 관습이 그리스어를 거쳐 들어왔다. 라틴어로는 잉여이므로 번역할 때 콜론 하나로 대체해도 된다."}]},{"sentence_id":"mk-1-8","items":[{"q_ko":"aquā의 마지막 a는 길다. 짧으면 무엇이 되는가?","a_ko":"aqua가 되어 주격이 된다. 1변화 명사는 주격 -a와 탈격 -ā가 마크론으로만 구별되므로, 마크론을 빼면 '물이'와 '물로'가 뒤섞인다. 여기서는 세례의 수단이므로 탈격 aquā여야 한다. SPEC 7장이 말한 rosa/rosā의 실제 사례다."},{"q_ko":"Ego와 ille가 둘 다 명시된 이유는?","a_ko":"대조하기 위해서다. 라틴어는 동사 어미가 인칭을 알려 주므로 주어 대명사가 필요 없지만, 두 주체를 맞세울 때는 일부러 써서 대립을 부각한다. '나는 ... 그러나 그는 ...'이라는 대구가 이 구절의 요지다."},{"q_ko":"vērō는 무엇을 하는 단어인가?","a_ko":"앞 절과의 대조를 표시하는 논증 연결어다. 문장 두 번째 자리에 놓이는 후치어이므로 문두로 옮겨 '그러나'로 번역한다. 뜻을 외우는 것보다 '이 단어가 나오면 앞과 반대되는 내용이 온다'는 기대를 훈련하는 것이 중요하다. SPEC 3.5의 4층 어휘가 바로 이런 부류다."},{"q_ko":"Spīritū는 몇 변화이며 -ū로 끝나는 다른 후보는 무엇인가?","a_ko":"4변화다. 4변화 남성 명사의 탈격 단수가 -ū이고, 소유격 복수 -uum, 여격·탈격 복수 -ibus로 이어진다. -ū 어미는 4변화 탈격 단수 외에 supine의 두 번째 형태(예: dictū)도 있으니 문맥으로 갈라야 한다. spīritus를 2변화로 오해해 소유격을 spīritī로 만들지 않도록 주의한다."},{"q_ko":"완료(baptizāvī)와 미래(baptizābit)의 대조가 말하는 바는?","a_ko":"요한의 세례는 이미 끝난 일이고 그분의 세례는 아직 오지 않았다는 것이다. 시제 자체가 두 세례의 관계를 규정한다. 어휘가 아니라 시제가 논지를 짊어지는 문장이므로, 시제를 흘려 읽으면 요점을 놓친다."},{"q_ko":"aquā에는 전치사가 없는데 5절의 ab illō에는 ab가 있다. 왜 다른가?","a_ko":"수단탈격은 사물이면 전치사 없이 쓰고, 행위자탈격은 사람이면 ā/ab를 반드시 붙이기 때문이다. 물은 도구이므로 맨 탈격, 요한은 행위자이므로 ab가 필요하다. 이 구별은 수동태를 만날 때마다 되풀이되므로 반사적으로 나와야 한다."},{"q_ko":"baptizābit의 -bit는 미래인가 미완료인가?","a_ko":"미래다. 1변화·2변화 동사의 미래는 -bō, -bis, -bit이고 미완료는 -bam, -bās, -bat이다. -ba-가 보이면 미완료, -bi-가 보이면 미래로 갈라진다. 7절의 praedicābat(미완료)와 나란히 놓고 보면 한 글자 차이가 시제를 가르는 것이 보인다."}]},{"sentence_id":"mk-1-9","items":[{"q_ko":"이 절의 vēnit와 7절의 Venit는 철자가 같다. 무엇이 다른가?","a_ko":"모음 길이가 다르고 그래서 시제가 다르다. 7절은 venit(직설법 현재, '온다'), 9절은 vēnit(직설법 완료, '왔다')이다. 4변화 동사 veniō의 완료 어간은 vēn-으로 현재 어간 ven-과 모음 길이만 다르다. 마크론이 없으면 두 절을 구별할 수 없고, 실제로 이 구별이 서사의 시간 구조 전체를 결정한다. 이 앱이 모든 본문에 마크론을 요구하는 이유가 이 한 쌍에 압축되어 있다."},{"q_ko":"factum est는 무엇의 번역이며 주어가 무엇인가?","a_ko":"히브리어 서사 관용구 wayhî(그리고 ~하는 일이 있었다)를 그리스어 ἐγένετο를 거쳐 옮긴 것이다. 주어가 될 명사가 없으므로 중성 단수를 써서 비인칭으로 처리한다. 뒤따르는 절 전체가 사실상 주어 노릇을 한다. 새 장면을 여는 신호로 읽으면 된다."},{"q_ko":"baptizātus est는 완료 수동인가, 현재 수동인가?","a_ko":"완료 수동이다. est가 현재형이라 헷갈리지만, 완료수동분사와 결합하면 전체가 완료 수동이 된다. '세례를 받고 있다'가 아니라 '세례를 받았다'이다. 현재 수동은 baptizātur 한 단어로 쓴다. 이 착각은 초심자가 가장 자주 하는 실수 중 하나다."},{"q_ko":"ā Iōhanne와 in Iordāne는 둘 다 탈격이다. 용법이 어떻게 다른가?","a_ko":"ā Iōhanne는 행위자탈격으로 세례를 준 사람을, in Iordāne는 장소탈격으로 그 일이 일어난 곳을 가리킨다. 형태가 같은 탈격이라도 전치사와 문맥이 용법을 나눈다. 탈격을 만나면 격이 아니라 '무슨 탈격인가'를 먼저 물어야 한다."},{"q_ko":"시간탈격은 보통 전치사 없이 쓰는데 여기는 왜 in이 붙었는가?","a_ko":"고전 라틴어라면 illīs diēbus만으로 충분하다. in을 붙인 것은 그리스어 ἐν ταῖς ἡμέραις를 그대로 옮긴 번역체다. 불가타에는 이렇게 고전 어법보다 전치사가 더 붙는 자리가 많으므로, 고전 문법으로 어색해 보이면 그리스어 원문을 의심하는 것이 요령이다."},{"q_ko":"Nazareth는 왜 격변화하지 않는가?","a_ko":"히브리어에서 온 무변화 고유명사이기 때문이다. 라틴어 변화표 어디에도 들어가지 않고 형태가 고정된다. 격은 전치사 ā가 알려 준다. 성경 라틴어의 히브리어 지명·인명 상당수가 이렇게 무변화이며, 반대로 Iēsūs나 Iōhannēs처럼 부분적으로 라틴어 변화를 받아들인 이름도 있어 단어별로 확인해야 한다."},{"q_ko":"Galilaeae는 소유격인가 여격인가? 어떻게 판단하는가?","a_ko":"소유격이다. 1변화의 -ae는 소유격 단수·여격 단수·주격 복수가 모두 같은 악명 높은 어미다. 여기서는 Nazareth를 한정해 '갈릴래아의 나사렛'을 이루므로 소유격이다. 여격으로 읽으면 걸릴 동사가 없고, 주격 복수로 읽으면 문장에 주어가 둘이 되어 성립하지 않는다. -ae를 만나면 이 세 후보를 놓고 소거하는 습관을 들이라."},{"q_ko":"diēbus는 5변화인데 남성인가 여성인가?","a_ko":"diēs는 보통 남성이지만 특정한 날짜를 가리킬 때는 여성으로 쓰기도 한다. 여기서는 illīs가 남성 복수 탈격이므로 남성이다. 5변화 명사는 대부분 여성인데 diēs가 예외라는 점이 자주 시험된다."}]},{"sentence_id":"mk-1-10","items":[{"q_ko":"dēscendentem과 manentem은 columbam을 수식하는가, Spīritum을 수식하는가?","a_ko":"Spīritum이다. 두 분사는 대격 단수 남성인데 columbam은 여성이므로 성이 맞지 않는다. spīritus가 남성 명사이므로 분사는 그쪽에 걸린다. 위치상으로는 columbam 바로 뒤에 있어 착각하기 쉽지만, 라틴어에서 짝을 정하는 것은 거리가 아니라 성·수·격 일치다. 이 문장은 그 원리를 시험하기에 가장 좋은 예다."},{"q_ko":"vīdit인가 videt인가? 무엇이 결정되는가?","a_ko":"vīdit, 즉 직설법 완료다. videō의 완료 어간은 vīd-로 장모음이고, 현재는 videt로 어간모음 자체가 다르다. 여기서는 그리스어 아오리스트에 대응하는 완료다. 서사의 주된 사건을 나르는 동사이므로 시제를 잘못 잡으면 장면 전체가 흐려진다."},{"q_ko":"caelōs apertōs는 '열린 하늘을 보았다'인가, '하늘이 열린 것을 보았다'인가?","a_ko":"후자로 읽는 것이 자연스럽다. vīdit 같은 지각동사는 목적어와 함께 서술 대격을 취해 '~이 ~한 상태임을 보다'를 나타낸다. 즉 apertōs는 caelōs를 꾸미는 것이 아니라 caelōs가 어떤 상태인지를 서술한다. 3절의 rēctās facite sēmitās와 같은 구조다."},{"q_ko":"apertōs는 무슨 형태인가?","a_ko":"aperiō의 완료수동분사(PPP) 대격 복수 남성이다. aperiō, aperīre, aperuī, apertus의 네 번째 주요형에서 왔다. 4주요형은 -us 형태로 외운다."},{"q_ko":"ascendēns의 주어는 누구인가? 문장 안에 명시되어 있는가?","a_ko":"예수다. 이 문장에는 명시된 주어가 없고 9절에서 이어받는다. 분사가 주격 단수 남성이므로 vīdit의 생략된 주어와 같은 대상임을 알 수 있다. 정동사의 어미와 분사의 격이 함께 생략된 주어를 지목하는 구조다."},{"q_ko":"dē aquā의 탈격 용법은?","a_ko":"분리탈격이다. ascendēns(올라오면서)의 출발점을 나타낸다. dē는 '~로부터 아래에서 위로'라는 방향성을 담고 있어 ex나 ab보다 이 장면에 잘 맞는다. 8절의 aquā(수단탈격)와 형태가 같지만 용법이 전혀 다르다는 점을 함께 확인하라."},{"q_ko":"tamquam columbam이 왜 대격인가?","a_ko":"비교되는 대상이 Spīritum과 같은 격을 취하기 때문이다. tamquam은 격을 지배하는 전치사가 아니라 비교를 표시하는 접속사이므로, 비교 대상의 격은 그것이 견주어지는 말을 따라간다. Spīritum이 대격이니 columbam도 대격이다."},{"q_ko":"in ipsō에서 ipse와 is의 차이는?","a_ko":"ipse는 강조대명사로 '바로 그 자신'을 가리키고, is는 색채 없는 지시대명사다. 여기서 ipsō를 쓴 것은 성령이 다른 누구도 아닌 그분 위에 머물렀음을 부각한다. 다만 후기 라틴어에서는 ipse가 강조를 잃고 단순 지시로 약해지는 경향이 있어 불가타에서는 판단이 늘 분명하지는 않다."},{"q_ko":"caelōs가 복수인 이유는?","a_ko":"히브리어 שָׁמַיִם이 형태상 복수라서 그리스어와 라틴어 번역이 복수를 그대로 옮겼기 때문이다. 라틴어 caelum은 본래 2변화 중성 단수로 쓰이나, 복수는 caelī로 남성이 되는 특이한 명사다. 성경 라틴어에서 '하늘들'이 복수로 나오면 셈어의 흔적으로 보면 된다."},{"q_ko":"statim은 마가복음에서 어떤 구실을 하는가?","a_ko":"장면을 빠르게 이어 붙이는 부사로, 마가복음에 유난히 자주 나온다(그리스어 εὐθύς). 뜻 자체는 단순하지만 이 책의 문체 표지이므로, 나올 때마다 '다음 장면으로 넘어간다'는 신호로 읽으면 흐름을 잡기 쉽다."}]},{"sentence_id":"mk-1-11","items":[{"q_ko":"facta est는 어느 시제·태인가? 그리고 왜 facta인가?","a_ko":"완료다. 태는 미묘하다 — 형태는 완료수동분사 + sum이지만 faciō의 수동은 '만들어지다'이고, 여기서는 '생기다, 일어나다'라는 자동사 뜻으로 쓰였다. facta가 여성인 것은 주어 vōx가 여성이기 때문이다. 분사는 언제나 주어에 성·수를 맞춘다."},{"q_ko":"dē caelīs가 왜 복수인가?","a_ko":"히브리어 שָׁמַיִם이 형태상 복수라 그리스어와 라틴어가 그대로 복수로 옮겼기 때문이다. 10절의 caelōs와 같은 현상이다. caelum은 단수일 때 중성 2변화지만 복수는 caelī로 남성이 되므로, 여기 caelīs의 성을 중성으로 잡으면 안 된다."},{"q_ko":"Tū가 왜 명시되었는가?","a_ko":"es의 어미 -s만으로 2인칭 단수는 이미 확정되므로 문법상 불필요하다. 굳이 쓰면 '다른 누구도 아닌 너'라는 강조가 생긴다. 2절의 ego, 8절의 Ego와 ille가 같은 용법이었다."},{"q_ko":"dīlēctus는 무슨 형태인가? 원 동사는?","a_ko":"dīligō(사랑하다, 택하여 아끼다)의 완료수동분사다. 주요형은 dīligō, dīligere, dīlēxī, dīlēctus. 여기서는 분사가 형용사처럼 굳어 '사랑받는'으로 읽힌다. 3절의 rēctās, 4절의 dēsertum과 같이 분사가 다른 품사로 굳는 사례다."},{"q_ko":"complacuī는 1인칭인데 주어가 누구인가?","a_ko":"말하는 이, 곧 하늘에서 소리를 내는 분이다. 라틴어는 어미가 인칭을 알려 주므로 주어 대명사가 없어도 된다. 앞의 Tū와 대비해 '나는 너를…'이라는 구도가 만들어진다."},{"q_ko":"in tē complacuī를 직역하면 '네 안에서 내가 기뻐하였다'인데, 어색하다. 왜 이런 라틴어가 나왔는가?","a_ko":"그리스어 ἐν σοὶ εὐδόκησα를 그대로 옮긴 번역체다. 고전 라틴어라면 complaceō는 여격을 지배해 mihi complacēs 같은 꼴이 된다. in + 탈격으로 대상을 나타내는 것은 셈어 관용구가 그리스어를 거쳐 들어온 흔적이다. 고전 문법으로 어색하면 원문을 의심하라."},{"q_ko":"완료 complacuī를 한국어로 '기뻐한다'로 옮겨도 되는가?","a_ko":"의역에서는 그렇게 옮기는 것이 자연스럽다. 그리스어 아오리스트가 라틴어 완료로 옮겨졌는데, 셈어 배경에서는 지나간 한 시점의 사건이 아니라 지속되는 상태를 뜻하는 경우가 많다. 다만 직역에서는 형태 그대로 완료로 두어야 학습자가 시제를 익힌다. 이 모듈은 직역과 의역을 나눠 그 차이를 보이도록 했다."}]},{"sentence_id":"mk-1-12","items":[{"q_ko":"expulit는 어떤 동사의 어떤 형태인가?","a_ko":"expellō(내몰다)의 직설법 완료 능동 3인칭 단수다. 주요형은 expellō, expellere, expulī, expulsus. 완료 어간이 expul-로 현재 어간 expell-과 다르므로 따로 외워야 한다. ex- + pellō의 합성어다."},{"q_ko":"in dēsertum이 왜 대격인가? 13절의 in dēsertō와 무엇이 다른가?","a_ko":"여기는 방향이라 대격이고, 13절은 정지된 위치라 탈격이다. 두 절이 나란히 붙어 있어 in의 두 얼굴을 대조하기에 가장 좋은 자리다. 내몰려 '들어갔고'(대격) 그 안에 '있었다'(탈격)."},{"q_ko":"Spīritus의 격은? 4변화의 다른 격과 어떻게 구별하는가?","a_ko":"주격 단수다. 4변화 남성은 주격 단수 -us, 소유격 단수 -ūs로 마크론만 다르다. 여기서는 expulit의 주어 자리이므로 주격이다. 마크론이 없으면 형태로는 구별할 수 없다 — 이 앱이 마크론을 필수로 두는 이유다."},{"q_ko":"statim이 마가복음에서 하는 구실은?","a_ko":"장면을 빠르게 이어 붙이는 마가복음의 문체 표지다(그리스어 εὐθύς). 10절에도 나왔고 20절에도 나온다. 뜻은 단순하지만 나올 때마다 '다음 장면으로 넘어간다'는 신호로 읽으면 흐름을 잡기 쉽다."},{"q_ko":"이 문장이 유난히 짧다. 문체상 의미가 있는가?","a_ko":"있다. 마가복음은 접속사 et로 짧은 절을 잇는 문체를 쓴다. 마태·누가가 같은 장면을 길게 늘이는 것과 대조된다. 독해 훈련의 첫 텍스트로 마가복음이 적합한 이유이기도 하다 — 문장이 짧아 구조 파악의 부담이 적다."}]},{"sentence_id":"mk-1-13","items":[{"q_ko":"quadrāgintā diēbus가 왜 탈격인가? 고전 문법과 다르지 않은가?","a_ko":"다르다. 고전 라틴어는 기간을 대격으로 나타낸다(quadrāgintā diēs manēbat, 사십 일 동안 머물렀다). 탈격은 원래 '언제'(시간탈격)를 나타내지 '얼마 동안'을 나타내지 않는다. 후기 라틴어에서 이 구별이 무너져 탈격이 기간까지 떠맡게 되었다. 휠록으로 배운 규칙과 어긋나는 자리이므로 반드시 짚고 넘어가야 한다."},{"q_ko":"tentābātur의 시제·태는? 완료였다면 뜻이 어떻게 달라지는가?","a_ko":"미완료 수동이다. 사십 일 내내 되풀이해 시험받고 있었다는 뜻이다. 완료 tentātus est였다면 한 번의 사건으로 끝난다. ministrābant도 미완료라 천사들의 섬김 역시 지속되는 상황으로 그려진다."},{"q_ko":"ā Satanā에서 ā가 붙은 이유는?","a_ko":"행위자탈격이고 행위자가 인격체이기 때문이다. 사람(또는 인격적 존재)이 수동태의 동작 주체일 때는 ā/ab를 반드시 붙인다. 사물이면 전치사 없이 수단탈격을 쓴다 — 8절의 aquā가 그 예다."},{"q_ko":"eratque의 -que는 무엇인가?","a_ko":"enclitic이다. 앞말에 붙어 '그리고'를 뜻하며 et와 같은 구실을 한다. 다른 enclitic으로 의문의 -ne, 선택의 -ve가 있다. 사전에서 eratque를 찾으면 안 되고 -que를 떼어 erat로 찾아야 한다."},{"q_ko":"illī의 격은? 왜 그 격인가?","a_ko":"여격 단수다. ministrō(섬기다)가 여격을 지배하기 때문이다. 한국어로 '그를 섬겼다'로 옮겨져 대격처럼 느껴지지만 라틴어는 여격이다. 지배 격이 한국어와 어긋나는 동사는 따로 외워야 한다 — crēdō(15절), pāreō, servio 등이 같은 부류다."},{"q_ko":"cum bēstiīs의 cum은 전치사인가 접속사인가?","a_ko":"전치사다. 뒤에 탈격 bēstiīs가 왔으므로 동반을 나타내는 전치사 cum이다. 접속사 cum이라면 절이 뒤따르고 동사가 있어야 한다. cum은 이 두 품사를 오가므로 뒤에 오는 것이 명사구인지 절인지부터 봐야 한다."},{"q_ko":"noctibus는 몇 변화이며 왜 그렇게 판단하는가?","a_ko":"3변화 i어간이다. nox, noctis에서 어간 noct-를 얻는다. 소유격 복수가 noctium으로 -ium인 것이 i어간의 표지다. 주격 nox는 어간 noct-에 -s가 붙어 ct+s가 x로 합쳐진 형태다."},{"q_ko":"이 절에 정동사가 몇 개인가?","a_ko":"넷이다 — erat, tentābātur, eratque, ministrābant. et와 -que로 이어진 네 개의 짧은 절이 한 절에 담겨 있다. 마가복음의 전형적인 문체다. 장문 해부의 첫 연습으로 삼기 좋다: 정동사를 먼저 다 찾고, 각 정동사의 주어를 찾은 뒤, 나머지를 붙이면 된다."}]},{"sentence_id":"mk-1-14","items":[{"q_ko":"Postquam은 어떤 절을 이끌며 뒤에 어떤 법이 오는가?","a_ko":"시간 부사절을 이끌고 직설법이 온다. '~한 뒤에'라는 뜻이다. 가정법이 오는 cum절과 달리 postquam은 사실을 진술하므로 직설법이다. 대개 완료와 함께 쓰여 주절보다 앞선 사건을 나타낸다."},{"q_ko":"autem의 위치가 왜 두 번째인가?","a_ko":"후치 접속 부사이기 때문이다. 문두에 올 수 없고 절의 두 번째 자리를 차지한다. 번역할 때는 문두로 옮겨 '그런데'로 옮긴다. enim(16절), vērō(8절)도 같은 부류이며, 이런 입자들이 논증의 흐름을 짊어진다."},{"q_ko":"trāditus est의 직역은? 문맥상 무슨 뜻인가?","a_ko":"직역하면 '넘겨졌다'이고 문맥상 '체포되었다'를 뜻한다. trādō는 trāns + dō(건너 주다)로, 마가복음 전체에서 예수가 '넘겨지는' 장면마다 반복되는 주제어다. 지금 문맥 의미만 외우면 나중에 수난 서사에서 반복을 놓친다."},{"q_ko":"vēnit는 현재인가 완료인가?","a_ko":"완료다. 마크론이 있는 vēnit이므로 완료이고, 없는 venit이면 현재다. 1장 7절의 Venit(현재)와 9절의 vēnit(완료)를 이미 대조했다. 여기는 이미 일어난 사건이므로 완료다."},{"q_ko":"Evangelium rēgnī Deī에서 소유격이 두 겹이다. 각각 무엇에 걸리는가?","a_ko":"rēgnī는 Evangelium에, Deī는 rēgnī에 걸린다. '하나님의 나라'라는 덩어리가 먼저 만들어지고, 그 나라에 관한 복음이 된다. 1절의 evangeliī Iēsū Chrīstī와 같은 사슬 구조다. 소유격이 이어지면 안쪽부터 묶어 나가면 된다."},{"q_ko":"praedicāns의 격·수·성은 무엇에 맞춰졌는가?","a_ko":"주절의 주어 Iēsūs에 맞춰 주격 단수 남성이다. 부사절의 주어 Iōhannēs가 아니다. 분사를 만나면 어미로 격을 읽고 그 격에 맞는 명사를 찾되, 어느 절에 속하는지도 함께 봐야 한다."},{"q_ko":"in Galilaeam이 대격인 이유는?","a_ko":"방향이기 때문이다. 갈릴래아 '안으로' 왔다는 뜻이다. 정지된 위치라면 in Galilaeā로 탈격이 된다. 12절의 in dēsertum과 같은 용법이다."}]},{"sentence_id":"mk-1-15","items":[{"q_ko":"Quoniam이 여기서 무엇을 하는가? '왜냐하면'으로 옮겨야 하는가?","a_ko":"아니다. 여기서는 직접화법을 여는 표지로, 그리스어 ὅτι의 직역이다. 그리스어 ὅτι는 인용을 여는 구실도 하는데 라틴어 quoniam에는 그 용법이 없다. 번역할 때는 옮기지 않고 따옴표로 대신하는 것이 낫다. 고전 라틴어에서 quoniam은 '~ 때문에'다."},{"q_ko":"implētum est와 appropinquāvit는 둘 다 완료다. 어떤 완료인가?","a_ko":"결과가 현재까지 이어지는 완료다. '때가 채워져서 지금 차 있다', '나라가 다가와서 지금 가까이 있다'는 뜻이다. 단순히 이전에 일어난 사건을 보고하는 것이 아니라 현재의 상태를 선언하는 것이며, 그래서 뒤에 명령이 이어질 수 있다."},{"q_ko":"paenitēminī의 형태를 분석하라.","a_ko":"명령법 현재 2인칭 복수, 디포넌트다. 어미 -minī는 수동·디포넌트의 2인칭 복수 표지다. paeniteō는 고전 라틴어에서 주로 비인칭(paenitet mē, 나는 후회한다)으로 쓰이는데, 후기 라틴어에서 인칭 활용을 하게 되었다. 사전에서 찾기 까다로운 형태다."},{"q_ko":"이 단어가 종교개혁과 무슨 관계가 있는가?","a_ko":"직접적인 관계가 있다. 그리스어 원어는 μετανοεῖτε(생각을 바꾸라)인데, 불가타는 이 계열을 paenitentiam agite(고해를 행하라)로 옮겼고 그것이 고해성사의 근거 본문 노릇을 했다. 1516년 에라스무스가 resipīscite(정신을 차리라)로 새로 옮겼고, 루터의 95개 논제 첫 조항이 바로 이 문제를 건드린다. 같은 그리스어 한 단어를 어느 라틴어로 받느냐가 성사 신학을 갈랐다. 판본 문제가 곧 신학 문제인 대표적인 자리다."},{"q_ko":"crēdite Evangeliō에서 Evangeliō의 격은? 왜 그 격인가?","a_ko":"여격이다. crēdō가 여격을 지배하기 때문이다. 형태만 보면 2변화 중성의 여격과 탈격이 같아 -ō로 구별되지 않지만, crēdō의 지배 격을 알면 여격으로 확정된다. 13절의 ministrābant illī와 같은 부류다."},{"q_ko":"crēdite와 paenitēminī는 둘 다 명령인데 어미가 다르다. 왜인가?","a_ko":"crēdō는 능동 동사라 능동 명령 어미 -te를 쓰고, paeniteor는 디포넌트라 수동형 어미 -minī를 쓴다. 디포넌트는 형태가 수동이므로 명령도 수동 어미를 쓴다. 뜻은 둘 다 능동이다."},{"q_ko":"tempus의 격을 어떻게 아는가?","a_ko":"3변화 중성이라 주격과 대격이 같지만, implētum est의 주어 자리이므로 주격이다. implētum이 중성 단수인 것도 tempus와 성·수를 맞춘 결과다. 중성 명사는 늘 문맥이 격을 정한다."},{"q_ko":"rēgnum Deī는 어느 어휘 층에 속하는가?","a_ko":"신학 용어이므로 3층에 걸린다. 다만 개혁파와 로마의 이해가 정면으로 충돌하는 3c 어휘라기보다, 전통 전반이 공유하되 강조점이 갈리는 부류에 가깝다. 오웬 단계에 가면 rēgnum Chrīstī, rēgnum grātiae 같은 파생 용어가 나오므로 지금부터 원어로 익혀 두는 것이 좋다."}]},{"sentence_id":"mk-1-16","items":[{"q_ko":"praeteriēns의 원 동사는 무엇이며 왜 주의해야 하는가?","a_ko":"praetereō(지나가다)로, praeter + eō의 합성어다. eō는 불규칙 동사이므로 합성어도 불규칙 활용을 물려받는다. 현재분사가 praeteriēns, praetereuntis로 어간이 흔들린다. eō, ferō, volō 계열의 합성어를 만나면 원 동사의 불규칙을 먼저 떠올려야 한다."},{"q_ko":"secus는 무슨 품사이며 어떤 격을 지배하는가?","a_ko":"여기서는 대격을 지배하는 전치사로 '~을 따라'를 뜻한다. 드문 용법이라 사전에서도 부사 항목이 먼저 나온다. 뒤에 대격 mare가 왔다는 것이 전치사로 읽을 근거다."},{"q_ko":"mittentēs는 무엇을 수식하는가? 격으로 판별하라.","a_ko":"대격 복수 남성이므로 Simōnem과 Andrēam을 함께 받는다. vīdit 같은 지각동사는 목적어와 함께 그 상태를 서술하는 분사를 취한다. 그래서 '그들을 보았다 + 그들이 그물을 던지고 있는 것을'이 한 구조로 묶인다. 10절의 dēscendentem, manentem과 같은 원리다."},{"q_ko":"mare가 이 절에 두 번 나온다. 격이 같은가?","a_ko":"형태는 같지만 역할이 다르다. 앞의 mare는 secus의 목적어이고 뒤의 mare는 in의 목적어다. 둘 다 대격이지만 지배하는 전치사가 다르다. 3변화 중성 i어간이라 주격과 대격이 mare로 같으므로 늘 문맥으로 정해야 한다."},{"q_ko":"enim의 위치가 왜 두 번째인가?","a_ko":"후치 접속 부사이기 때문이다. 14절의 autem과 같다. '왜냐하면'을 뜻하며 앞 내용의 이유를 댄다. 번역할 때는 문두로 옮긴다. 이런 입자를 만나면 '앞 문장과 어떤 논리 관계인가'를 먼저 물어야 한다 — 뜻보다 기능이 중요한 4층 어휘다."},{"q_ko":"괄호 안의 erant enim piscātōrēs는 누구의 말인가?","a_ko":"저자의 설명이다. 독자에게 배경을 알려 주는 삽입절이며 예수의 말도 등장인물의 말도 아니다. 미완료 erant를 쓴 것도 그들의 지속적인 신분을 나타내기 위해서다. 괄호는 현대 편집자가 넣은 것이고 원문에는 없다."},{"q_ko":"frātrem eius가 Andrēam과 동격인 것은 어떻게 아는가?","a_ko":"둘 다 대격 단수 남성으로 격·수·성이 일치하고, 사이에 접속사가 없기 때문이다. 접속사 없이 같은 격의 명사가 나란히 놓이면 동격을 의심한다. 1절의 Fīliī Deī도 같은 판별법이었다."},{"q_ko":"rētia는 몇 변화이며 왜 -ia인가?","a_ko":"3변화 중성 i어간이다. rēte, rētis에서 왔고, i어간 중성은 복수 주격·대격이 -ia가 된다(일반 3변화 중성은 -a). 소유격 복수도 -ium이 된다. mare도 같은 부류라 복수는 maria다."}]},{"sentence_id":"mk-1-17","items":[{"q_ko":"Venīte post mē를 직역하면? 어떤 관용인가?","a_ko":"'내 뒤로 오라'다. 히브리어 관용구를 그대로 옮긴 것으로 '나를 따르라'는 제자 부름의 표현이다. 7절의 Venit fortior post mē에서 post mē가 시간('나보다 나중에')이었던 것과 달리 여기서는 공간·추종의 뜻이다. 같은 어구가 문맥에 따라 달라지는 예다."},{"q_ko":"faciam은 미래인가 가정법인가?","a_ko":"형태만으로는 둘 다 가능하다. faciō는 3-io변화라 미래 1인칭 단수도 faciam, 현재 가정법 1인칭 단수도 faciam이다. 여기서는 앞의 명령에 이어지는 약속이므로 미래로 읽는다. 3변화·4변화 동사에서 이 중의성은 늘 따라다니므로 문맥으로 갈라야 한다."},{"q_ko":"faciam vōs fierī의 구조를 분석하라.","a_ko":"faciō + 대격 + 부정사 구조다. vōs가 대격이면서 fierī의 의미상 주어를 겸한다. 직역하면 '너희가 ~이 되도록 내가 만들겠다'이다. 대격부정법과 형태가 비슷해 보이지만, 대격부정법은 지각·발화 동사 뒤에서 간접 진술을 이루는 것이고 여기는 사역 구조다."},{"q_ko":"fierī는 어떤 동사의 무슨 형태인가?","a_ko":"fīō(되다)의 현재 부정사다. fīō는 불규칙 동사이며 faciō의 수동 구실을 겸한다. 주요형은 fīō, fierī, factus sum. 부정사 fierī는 능동형인데 완료는 factus sum으로 수동형이라 반디포넌트처럼 보이는 독특한 동사다."},{"q_ko":"piscātōrēs의 격은? 주격 아닌가?","a_ko":"대격이다. 3변화 남성은 주격 복수와 대격 복수가 -ēs로 같아 형태로는 구별되지 않는다. 여기서는 vōs를 서술하는 보어이고 vōs가 대격이므로 대격이다. 3절의 rēctās, 10절의 apertōs와 같은 서술 대격이다."},{"q_ko":"piscātōrēs hominum의 소유격은 어떤 종류인가?","a_ko":"목적어적 소유격이다. '사람을 낚는 어부'라는 뜻이므로 hominēs가 낚는 행위의 대상이다. 주어적으로 읽으면 '사람들이 소유한 어부'가 되어 말이 되지 않는다. piscātor가 동작에서 온 명사이므로 소유격의 종류를 먼저 물어야 한다."},{"q_ko":"eīs의 격과 그 근거는?","a_ko":"여격 복수다. dīcō가 '누구에게' 말하는지를 여격으로 받기 때문이다. 형태상 is의 여격 복수와 탈격 복수가 eīs로 같지만, 발화 동사의 간접목적어 자리이므로 여격이다."}]},{"sentence_id":"mk-1-18","items":[{"q_ko":"relictīs rētibus는 무슨 구문인가?","a_ko":"독립탈격이다. 분사와 명사가 모두 탈격이고, 주절의 어느 성분과도 격이 맞지 않으면서 배경 상황을 나타내면 독립탈격이다. 직역하면 '그물들이 버려진 채로'이고, 자연스럽게는 '그물을 버려두고'가 된다."},{"q_ko":"독립탈격인지 어떻게 판별하는가?","a_ko":"세 가지를 본다. 첫째, 명사와 분사가 둘 다 탈격인가. 둘째, 그 탈격이 주절의 동사나 전치사에 걸리지 않는가. 셋째, 그 명사가 주절의 주어·목적어와 다른가. 셋 다 맞으면 독립탈격이다. 여기서 rētibus는 어떤 전치사에도 걸리지 않고 주절의 주어(따라간 사람들)도 아니다."},{"q_ko":"독립탈격을 한국어로 옮길 때 무엇을 정해야 하는가?","a_ko":"논리 관계다. 라틴어 독립탈격 자체는 시간·이유·조건·양보 중 어느 것도 명시하지 않는다. 문맥이 정한다. 여기서는 시간·부대상황이므로 '~하고 나서, ~한 채로'가 맞다. 이유라면 '~이므로', 양보라면 '~에도 불구하고'가 된다."},{"q_ko":"secūtī sunt가 왜 능동으로 번역되는가?","a_ko":"sequor가 디포넌트이기 때문이다. 형태는 완료 수동(분사 + sum)이지만 뜻은 능동 '따라갔다'이다. 주요형은 sequor, sequī, secūtus sum. 5절의 ēgrediēbātur, cōnfitentēs와 같은 부류다."},{"q_ko":"relictīs가 중성 복수인 이유는?","a_ko":"rētia(그물)가 3변화 중성이기 때문이다. 분사는 자기가 걸리는 명사에 성·수·격을 맞춘다. 20절의 relictō patre에서는 patre가 남성 단수라 relictō가 된다 — 같은 분사가 무엇에 걸리느냐에 따라 형태가 달라지는 것을 나란히 볼 수 있다."},{"q_ko":"prōtinus와 statim은 어떻게 다른가?","a_ko":"뜻은 거의 같고 둘 다 '즉시'다. 마가복음은 두 부사를 섞어 쓴다. 문체 변화 이상의 의미 차이를 찾을 필요는 없다. 다만 어휘 카드에서는 별개 표제어로 다뤄야 한다."}]},{"sentence_id":"mk-1-19","items":[{"q_ko":"prōgressus는 무슨 형태이며 시점은 언제인가?","a_ko":"prōgredior(나아가다)의 완료분사 주격 단수 남성이다. 디포넌트이므로 형태는 수동이지만 뜻은 능동이다. 완료분사이므로 주동사 vīdit보다 앞선 동작이다 — 먼저 나아가고 그다음에 보았다. 현재분사였다면 동시가 된다."},{"q_ko":"pusillum의 격과 용법은?","a_ko":"대격 단수 중성인데 부사처럼 쓰였다. '조금'이라는 정도를 나타내는 부사적 대격이다. 형용사의 중성 대격이 부사 구실을 하는 것은 라틴어에 흔하다(multum, paulum, nihil 등). 목적어로 잡으면 걸릴 동사가 없다."},{"q_ko":"Iacōbum Zebedaeī를 직역하면 무엇이 빠졌는가?","a_ko":"'아들'이 빠졌다. '제베대오의 야고보'인데 소유격만으로 아들 관계를 나타내는 관용이다. 그리스어도 τὸν τοῦ Ζεβεδαίου로 명사를 생략한다. 인명 뒤의 맨 소유격을 보면 '~의 아들'을 먼저 의심하라."},{"q_ko":"compōnentēs는 무엇을 수식하는가?","a_ko":"ipsōs다. 대격 복수 남성으로 격·수·성이 일치한다. 16절의 mittentēs가 Simōnem et Andrēam을 받은 것과 같은 구조이며, 두 장면이 의도적으로 대구를 이룬다 — 앞의 두 형제도, 뒤의 두 형제도 그물 일을 하다가 부름받는다."},{"q_ko":"ipsōs를 왜 굳이 썼는가?","a_ko":"'그들도 역시'라는 강조 때문이다. 앞의 시몬·안드레아와 같은 처지였음을 부각한다. ipse는 강조대명사라 색채 없는 is와 달리 대비나 강조를 담는다. 다만 후기 라틴어에서 이 강조가 약해지는 경향이 있어 늘 강하게 읽을 필요는 없다."},{"q_ko":"in nāvī의 탈격 어미가 왜 -ī인가?","a_ko":"nāvis가 i어간 3변화이기 때문이다. i어간 명사는 탈격 단수가 -e 또는 -ī로 나타나는데, nāvis는 두 형태가 모두 쓰인다. 클레멘스판이 nāvī를 택했다. 일반 3변화라면 -e만 가능하다."},{"q_ko":"compōnō를 '손질하다'로 옮겼다. 사전적 뜻과 어떻게 이어지는가?","a_ko":"com + pōnō(함께 놓다)가 기본 뜻이고, 여기서 '정돈하다, 갖추어 놓다'가 파생되어 그물을 손질한다는 뜻이 되었다. 합성 동사는 접두사와 원 동사로 쪼개면 뜻이 보인다. 사전 뜻 하나를 외우기보다 이 분해 습관을 들이는 편이 오웬 독해에 훨씬 유용하다."}]},{"sentence_id":"mk-1-20","items":[{"q_ko":"relictō patre suō Zebedaeō는 무슨 구문인가? 18절과 비교하라.","a_ko":"독립탈격이다. 18절의 relictīs rētibus와 같은 구조인데, 걸리는 명사가 남성 단수 patre라서 분사도 relictō가 되었다. 같은 동사의 같은 분사가 무엇에 걸리느냐로 형태가 달라지는 것을 두 절에서 나란히 볼 수 있다. 독립탈격을 익히기에 이보다 좋은 짝은 드물다."},{"q_ko":"Zebedaeō는 무엇과 동격인가?","a_ko":"patre와 동격이다. 둘 다 탈격 단수 남성이고 사이에 접속사가 없다. '아버지 제베대오'로 묶인다. 19절에서는 Zebedaeī가 소유격으로 '제베대오의 [아들]'이었는데, 여기서는 탈격 동격이다. 같은 이름이 격에 따라 전혀 다른 역할을 한다."},{"q_ko":"suō가 독립탈격 안에 있다. 재귀 규칙에 맞는가?","a_ko":"엄밀히는 맞지 않는다. 재귀 소유형용사 suus는 소유자가 그 절의 주어일 때 쓰는데, 독립탈격은 문법상 주절과 분리된 구조이고 아버지의 소유자는 주절의 주어(따라간 아들들)다. 고전 라틴어라면 eōrum이 더 정확하다. 후기 라틴어에서 재귀 규칙이 느슨해진 사례이며, 규칙을 막 배운 학습자가 혼란을 겪는 자리다."},{"q_ko":"cum mercēnāriīs는 누구와 함께인가?","a_ko":"아버지 제베대오와 함께다. 독립탈격 안에 들어 있어 '아버지가 삯꾼들과 함께 배에 남겨진 채로'가 된다. 따라간 아들들이 삯꾼과 함께 간 것이 아니다. 독립탈격의 경계를 잘못 잡으면 이 관계가 뒤집힌다."},{"q_ko":"vocāvit와 secūtī sunt는 둘 다 완료다. 어떤 완료인가?","a_ko":"서사의 사건을 나르는 완료다. 13절의 미완료들이 배경을 깔았다면, 여기 완료들은 한 시점에 일어난 일을 순서대로 보고한다. 미완료와 완료가 서사에서 하는 구실이 다르다는 것을 두 절을 견주어 확인할 수 있다."},{"q_ko":"illōs와 eum은 각각 누구를 가리키는가?","a_ko":"illōs는 야고보와 요한, eum은 예수다. 지시대명사가 짧은 구간에 두 방향으로 쓰였으므로 문맥을 놓치면 뒤집힌다. 라틴어는 대명사가 성·수·격을 드러내므로 형태를 먼저 보고 후보를 좁히는 습관이 필요하다."},{"q_ko":"mercēnārius의 어원은?","a_ko":"mercēs(삯, 보수)에서 왔다. mercēs, mercēdis는 3변화 여성이며 여기서 형용사 mercēnārius(삯을 받는)가 나오고 명사로 굳어 '삯꾼'이 되었다. 신약에서 삯꾼은 목자와 대비되는 표상으로 자주 쓰이므로 뜻만이 아니라 함의도 익혀 둘 만하다."}]}],"lemma_index":[{"lemma_id":"lem:initium","lemma":"initium, initiī, n. (복수 initia)","pos":"명사","gloss_ko":"시작"},{"lemma_id":"lem:evangelium","lemma":"evangelium, evangeliī, n. (복수 evangelia)","pos":"명사","gloss_ko":"복음"},{"lemma_id":"lem:Iesus","lemma":"Iēsūs, Iēsū, m.","pos":"고유명사","gloss_ko":"예수 (그리스어계 불규칙 변화)"},{"lemma_id":"lem:Christus","lemma":"Chrīstus, Chrīstī, m.","pos":"고유명사","gloss_ko":"그리스도, 기름부음받은 자"},{"lemma_id":"lem:filius","lemma":"fīlius, fīliī, m.","pos":"명사","gloss_ko":"아들"},{"lemma_id":"lem:deus","lemma":"deus, deī, m.","pos":"명사","gloss_ko":"신, 하나님"},{"lemma_id":"lem:sicut","lemma":"sīcut","pos":"접속사","gloss_ko":"~와 같이"},{"lemma_id":"lem:scribo","lemma":"scrībō, scrībere, scrīpsī, scrīptus","pos":"동사","gloss_ko":"쓰다, 기록하다 (3변화)"},{"lemma_id":"lem:sum","lemma":"sum, esse, fuī, futūrus","pos":"동사","gloss_ko":"이다, 있다 (불규칙, 4주요형은 FAP)"},{"lemma_id":"lem:in","lemma":"in","pos":"전치사","gloss_ko":"(+탈격) ~ 안에 / (+대격) ~ 안으로, ~을 향하여"},{"lemma_id":"lem:Isaias","lemma":"Isaiās, Isaiae, m.","pos":"고유명사","gloss_ko":"이사야 (1변화지만 남성)"},{"lemma_id":"lem:propheta","lemma":"prophēta, prophētae, m.","pos":"명사","gloss_ko":"예언자 (1변화지만 남성)"},{"lemma_id":"lem:ecce","lemma":"ecce","pos":"감탄사","gloss_ko":"보라"},{"lemma_id":"lem:ego","lemma":"ego, meī","pos":"대명사","gloss_ko":"나 (1인칭)"},{"lemma_id":"lem:mitto","lemma":"mittō, mittere, mīsī, missus","pos":"동사","gloss_ko":"보내다 (3변화)"},{"lemma_id":"lem:angelus","lemma":"angelus, angelī, m.","pos":"명사","gloss_ko":"사자, 천사"},{"lemma_id":"lem:meus","lemma":"meus, mea, meum","pos":"형용사","gloss_ko":"나의"},{"lemma_id":"lem:ante","lemma":"ante","pos":"전치사","gloss_ko":"(+대격) ~ 앞에, ~보다 먼저"},{"lemma_id":"lem:facies","lemma":"faciēs, faciēī, f.","pos":"명사","gloss_ko":"얼굴 (5변화)"},{"lemma_id":"lem:tuus","lemma":"tuus, tua, tuum","pos":"형용사","gloss_ko":"너의"},{"lemma_id":"lem:qui","lemma":"quī, quae, quod","pos":"관계대명사","gloss_ko":"~하는 (그것)"},{"lemma_id":"lem:praeparo","lemma":"praeparō, praeparāre, praeparāvī, praeparātus","pos":"동사","gloss_ko":"예비하다 (1변화)"},{"lemma_id":"lem:via","lemma":"via, viae, f.","pos":"명사","gloss_ko":"길"},{"lemma_id":"lem:tu","lemma":"tū, tuī","pos":"대명사","gloss_ko":"너 (2인칭)"},{"lemma_id":"lem:vox","lemma":"vōx, vōcis, f.","pos":"명사","gloss_ko":"소리, 목소리 (3변화)"},{"lemma_id":"lem:clamo","lemma":"clāmō, clāmāre, clāmāvī, clāmātus","pos":"동사","gloss_ko":"외치다 (1변화)"},{"lemma_id":"lem:desertum","lemma":"dēsertum, dēsertī, n. (복수 dēserta)","pos":"명사","gloss_ko":"광야 (dēserō의 완료수동분사에서 명사화)"},{"lemma_id":"lem:paro","lemma":"parō, parāre, parāvī, parātus","pos":"동사","gloss_ko":"준비하다 (1변화)"},{"lemma_id":"lem:dominus","lemma":"dominus, dominī, m.","pos":"명사","gloss_ko":"주인, 주"},{"lemma_id":"lem:rectus","lemma":"rēctus, rēcta, rēctum","pos":"형용사","gloss_ko
