사","gloss_ko":"때, 시간 (3변화)"},{"lemma_id":"lem:appropinquo","lemma":"appropinquō, appropinquāre, appropinquāvī, appropinquātus","pos":"동사","gloss_ko":"가까이 오다 (1변화)"},{"lemma_id":"lem:paeniteor","lemma":"paeniteor, paenitērī","pos":"동사","gloss_ko":"회개하다 (후기 라틴어의 디포넌트 인칭형; 고전은 비인칭 paenitet). 클레멘스 철자는 poenitemini"},{"lemma_id":"lem:credo","lemma":"crēdō, crēdere, crēdidī, crēditus","pos":"동사","gloss_ko":"믿다 (3변화, +여격)"},{"lemma_id":"lem:praetereo","lemma":"praetereō, praeterīre, praeteriī, praeteritus","pos":"동사","gloss_ko":"지나가다 (불규칙 동사 eō의 합성어)"},{"lemma_id":"lem:secus","lemma":"secus","pos":"전치사","gloss_ko":"(+대격) ~을 따라, ~ 곁에. 부사 '달리'로도 쓰임"},{"lemma_id":"lem:mare","lemma":"mare, maris, n. (복수 maria)","pos":"명사","gloss_ko":"바다 (3변화 i어간)"},{"lemma_id":"lem:Simon","lemma":"Simōn, Simōnis, m.","pos":"고유명사","gloss_ko":"시몬 (그리스어계 3변화)"},{"lemma_id":"lem:Andreas","lemma":"Andrēās, Andrēae, m.","pos":"고유명사","gloss_ko":"안드레아 (1변화지만 남성, 그리스어 차용)"},{"lemma_id":"lem:frater","lemma":"frāter, frātris, m.","pos":"명사","gloss_ko":"형제 (3변화)"},{"lemma_id":"lem:rete","lemma":"rēte, rētis, n. (복수 rētia)","pos":"명사","gloss_ko":"그물 (3변화 i어간)"},{"lemma_id":"lem:piscator","lemma":"piscātor, piscātōris, m.","pos":"명사","gloss_ko":"어부 (3변화)"},{"lemma_id":"lem:enim","lemma":"enim","pos":"부사","gloss_ko":"왜냐하면 (후치 접속 부사, 이유를 표시하는 논증 연결어)"},{"lemma_id":"lem:fio","lemma":"fīō, fierī, factus sum","pos":"동사","gloss_ko":"되다, 일어나다 (불규칙; faciō의 수동 구실을 겸함)"},{"lemma_id":"lem:homo","lemma":"homō, hominis, m.","pos":"명사","gloss_ko":"사람 (3변화)"},{"lemma_id":"lem:protinus","lemma":"prōtinus","pos":"부사","gloss_ko":"즉시, 곧"},{"lemma_id":"lem:relinquo","lemma":"relinquō, relinquere, relīquī, relictus","pos":"동사","gloss_ko":"남기다, 버려두다 (3변화)"},{"lemma_id":"lem:sequor","lemma":"sequor, sequī, secūtus sum","pos":"동사","gloss_ko":"따라가다 (디포넌트, 3변화)"},{"lemma_id":"lem:progredior","lemma":"prōgredior, prōgredī, prōgressus sum","pos":"동사","gloss_ko":"나아가다 (디포넌트, 3-io변화)"},{"lemma_id":"lem:inde","lemma":"inde","pos":"부사","gloss_ko":"거기서부터, 그때부터"},{"lemma_id":"lem:pusillus","lemma":"pusillus, pusilla, pusillum","pos":"형용사","gloss_ko":"아주 작은. 중성 대격은 부사적으로 '조금'"},{"lemma_id":"lem:Iacobus","lemma":"Iacōbus, Iacōbī, m.","pos":"고유명사","gloss_ko":"야고보"},{"lemma_id":"lem:Zebedaeus","lemma":"Zebedaeus, Zebedaeī, m.","pos":"고유명사","gloss_ko":"제베대오"},{"lemma_id":"lem:compono","lemma":"compōnō, compōnere, composuī, compositus","pos":"동사","gloss_ko":"정돈하다, 손질하다 (3변화, com + pōnō)"},{"lemma_id":"lem:navis","lemma":"nāvis, nāvis, f.","pos":"명사","gloss_ko":"배 (3변화 i어간; 탈격 단수는 nāve 또는 nāvī)"},{"lemma_id":"lem:voco","lemma":"vocō, vocāre, vocāvī, vocātus","pos":"동사","gloss_ko":"부르다 (1변화)"},{"lemma_id":"lem:pater","lemma":"pater, patris, m.","pos":"명사","gloss_ko":"아버지 (3변화)"},{"lemma_id":"lem:mercenarius","lemma":"mercēnārius, mercēnāriī, m.","pos":"명사","gloss_ko":"삯꾼 (mercēs '삯'에서 파생)"}],"glossary_candidates":[{"term":"서술 대격","en":"predicate accusative (object complement)","note":"영어 명칭은 Allen & Greenough에서 그대로 검색된다. 흔히 쓰이는 다른 한국어 라벨은 glossary의 never 목록에 걸리므로 이 표기를 쓴다.","used_in":["mk-1-3","mk-1-10"]},{"term":"표제 주격","en":"nominative of title / heading","note":"정동사 없이 제목 구실을 하는 주격. 1절과 3절의 명사문에 사용.","used_in":["mk-1-1","mk-1-3"]},{"term":"동격적 소유격","en":"genitive of apposition","note":"'요단이라는 강'처럼 소유가 아니라 동일성을 나타내는 소유격.","used_in":["mk-1-5"]},{"term":"설명적 부정사","en":"explanatory (epexegetical) infinitive","note":"형용사를 한정해 '무엇을 하기에'를 밝히는 부정사.","used_in":["mk-1-7"]},{"term":"우언적 표현","en":"periphrastic construction","note":"sum + 분사로 하나의 정동사를 대신하는 구조. 불가타의 그리스어 직역에서 잦다.","used_in":["mk-1-4","mk-1-6"]},{"term":"논증 연결어","en":"argumentative particle","note":"SPEC 3.5의 4층 어휘. vērō가 첫 사례.","used_in":["mk-1-8"]},{"term":"아오리스트","en":"aorist (Greek)","note":"그리스어 시제. 흔히 쓰이는 한국어 라벨은 glossary의 never 목록에 걸리므로 음차를 쓴다. SPEC 6장의 그리스어 필드 확장에 대비한 용어.","used_in":["mk-1-7","mk-1-9","mk-1-10"]},{"term":"셈어법","en":"Semitism","note":"히브리어·아람어 관용구가 그리스어를 거쳐 라틴어에 직역된 자리. 불가타 독해의 상시 변수.","used_in":["mk-1-2","mk-1-7","mk-1-9","mk-1-10"]},{"term":"무변화 고유명사","en":"indeclinable proper noun","note":"Nazareth처럼 격변화하지 않는 히브리어계 이름. 마크론을 붙일 근거가 없어 IPA 계산 함수에서 예외 처리가 필요하다.","used_in":["mk-1-9"]}],"lemma_index_note":"표제어 스텁. SPEC 3.1(Noun) / 3.2(Verb) 전체 스키마로 확장 예정. 4주요형은 전부 -us 형태로 표기하고 자동사는 FAP를 씀."};</script>
<script>
/* 라틴어 다독 — 앱 껍데기
 * 빌드 도구 없음. 이 파일이 곧 배포되는 파일이다.
 * 데이터는 data/*.json에서 실행 시점에 읽는다 (SPEC 2장 모듈 단위 전략).
 */
'use strict';

var MODULE_URL = './data/vulgate-mark-1.1-20.json';
var MACRONS = 'āēīōūĀĒĪŌŪ';
var PUNCT = ',.:;!?()’‘“”"\'';
var KIND_KO = {
  vowel_length: '마크론', parsing: '파싱', orthography: '철자',
  lemma: '표제어', text: '본문 이문'
};

/* ── 저장 도우미: 사파리 사생활 보호 모드에서 던질 수 있어 전부 감싼다 ── */
function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* ─────────────────────────── 서비스 워커 ─────────────────────────── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (e) {
      console.warn('서비스 워커 등록 실패:', e);
    });
  });
}

/* ─────────────────────────── 온라인 표시 ─────────────────────────── */
function paintNet() {
  var n = document.getElementById('net');
  if (navigator.onLine) { n.className = 'net on'; n.textContent = 'ONLINE'; }
  else { n.className = 'net off'; n.textContent = 'OFFLINE'; }
}
window.addEventListener('online', paintNet);
window.addEventListener('offline', paintNet);
paintNet();

/* ─────────────────────────── 탭 전환 ─────────────────────────── */
document.querySelectorAll('.tab').forEach(function (t) {
  t.addEventListener('click', function () {
    document.querySelectorAll('.tab').forEach(function (o) {
      var on = o === t;
      o.classList.toggle('on', on);
      o.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.getElementById('view-read').hidden = t.dataset.view !== 'read';
    document.getElementById('view-state').hidden = t.dataset.view !== 'state';
    if (t.dataset.view === 'state') runChecks();
    window.scrollTo(0, 0);
  });
});

/* ─────────────────────────── 모듈 렌더 ─────────────────────────── */
var DICT = {}, UNC = {}, curBtn = null;

function markLong(word) {
  var out = '';
  for (var i = 0; i < word.length; i++) {
    var ch = word[i];
    out += MACRONS.indexOf(ch) >= 0
      ? '<span class="lv">' + ch + '</span>'
      : ch.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  }
  return out;
}

function renderLatin(sent, toks) {
  var flagged = {};
  (sent.uncertain || []).forEach(function (u) {
    if (u.token_index != null) flagged[u.token_index] = 1;
  });
  var p = el('p', 'lat'), ti = 0, html = '';
  sent.latin.split(' ').forEach(function (chunk) {
    var lead = '', trail = '';
    while (chunk && PUNCT.indexOf(chunk[0]) >= 0) { lead += chunk[0]; chunk = chunk.slice(1); }
    while (chunk && PUNCT.indexOf(chunk[chunk.length - 1]) >= 0) {
      trail = chunk[chunk.length - 1] + trail; chunk = chunk.slice(0, -1);
    }
    if (lead) html += '<span class="pn">' + lead + '</span>';
    if (chunk) {
      html += '<button type="button" class="w' + (flagged[ti] ? ' flagged' : '') +
              '" data-s="' + sent.id + '" data-i="' + ti + '">' + markLong(chunk) + '</button>';
      ti++;
    }
    if (trail) html += '<span class="pn">' + trail + '</span>';
    html += ' ';
  });
  p.innerHTML = html;
  return p;
}

function fold(label, count) {
  var d = el('details'), s = el('summary');
  s.appendChild(el('span', 'k', label));
  if (count != null) s.appendChild(el('span', 'k', String(count)));
  d.appendChild(s);
  var b = el('div', 'body');
  d.appendChild(b);
  return { root: d, body: b };
}

function render(M) {
  // 표제어 색인
  var LEM = {};
  (M.lemma_index || []).forEach(function (l) { LEM[l.lemma_id] = l; });

  // 문장별 토큰
  var TOK = {};
  M.tokens.forEach(function (t) { (TOK[t.sentence_id] = TOK[t.sentence_id] || []).push(t); });
  Object.keys(TOK).forEach(function (k) { TOK[k].sort(function (a, b) { return a.index - b.index; }); });

  // 탭 사전 데이터
  Object.keys(TOK).forEach(function (sid) {
    DICT[sid] = TOK[sid].map(function (t) {
      var l = LEM[t.lemma_id] || {};
      return { s: t.surface, m: t.morph, r: t.syntax_role, l: l.lemma || '', g: l.gloss_ko || '' };
    });
  });
  M.sentences.forEach(function (s) {
    UNC[s.id] = (s.uncertain || []).map(function (u) {
      return { i: u.token_index, k: KIND_KO[u.kind] || u.kind };
    });
  });

  var QB = {}, CIT = {};
  (M.question_banks || []).forEach(function (q) { QB[q.sentence_id] = q.items; });
  (M.scripture_citations || []).forEach(function (c) { (CIT[c.sentence_id] = CIT[c.sentence_id] || []).push(c); });

  // 머리
  var ver = (M.bible_versions || []).filter(function (v) { return v.id === (M.sentences[0] || {}).source_version; })[0];
  var head = el('div', 'modhead');
  var first = M.sentences[0].id.replace('mk-1-', '');
  var last = M.sentences[M.sentences.length - 1].id.replace('mk-1-', '');
  head.appendChild(el('p', 'eyebrow', 'Evangelium secundum Marcum · 1,' + first + '–' + last));
  head.appendChild(el('h1', 'h1', M.scope || '불가타 마가복음'));
  var meta = el('div', 'meta');
  [ver ? ver.title.split('(')[0].trim() + ' ' + ver.year : M.base_text.edition,
    '토큰 ' + M.tokens.length,
    '질문 ' + Object.keys(QB).reduce(function (a, k) { return a + QB[k].length; }, 0)
  ].forEach(function (x) { meta.appendChild(el('span', 'tag', x)); });
  var unver = M.sentences.filter(function (s) { return s.verified === false; }).length;
  if (unver) meta.appendChild(el('span', 'tag warn', '미검증 ' + unver + '절'));
  head.appendChild(meta);
  head.appendChild(el('p', 'note',
    '번역은 접혀 있습니다. 라틴어로 먼저 끝까지 읽고, 막힌 뒤에 펼치십시오. ' +
    '점선 밑줄이 그어진 단어는 마크론이나 파싱이 아직 확정되지 않은 것입니다.'));
  document.getElementById('modmeta').appendChild(head);

  // 절
  var box = document.getElementById('verses');
  box.innerHTML = '';
  M.sentences.forEach(function (s) {
    var sec = el('section', 'verse');
    sec.id = s.id;
    sec.appendChild(el('p', 'vnum', s.id.replace('mk-1-', '1,')));
    sec.appendChild(renderLatin(s, TOK[s.id]));

    var rows = el('div', 'rows');

    var tr = fold('번역');
    var d1 = el('p', 'tr'); d1.appendChild(el('span', 'lbl', '직역'));
    d1.appendChild(document.createTextNode(s.translation_ko));
    tr.body.appendChild(d1);
    if (s.translation_free_ko) {
      var d2 = el('p', 'tr'); d2.appendChild(el('span', 'lbl', '의역'));
      d2.appendChild(document.createTextNode(s.translation_free_ko));
      tr.body.appendChild(d2);
    }
    rows.appendChild(tr.root);

    var items = QB[s.id] || [];
    if (items.length) {
      var qf = fold('질문', items.length);
      items.forEach(function (it, n) {
        var q = el('div', 'q'), b = el('button');
        b.type = 'button';
        b.setAttribute('aria-expanded', 'false');
        b.appendChild(el('span', 'n', String(n + 1).padStart(2, '0')));
        b.appendChild(el('span', null, it.q_ko));
        b.addEventListener('click', function () {
          var open = q.classList.toggle('open');
          b.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        q.appendChild(b);
        q.appendChild(el('div', 'a', it.a_ko));
        qf.body.appendChild(q);
      });
      rows.appendChild(qf.root);
    }

    (CIT[s.id] || []).forEach(function (c) {
      var cf = fold('구약 인용', c.ref);
      cf.body.className = 'body cit app';
      cf.body.appendChild(el('p', 'ref', c.ref + ' · 저자가 따른 본문: ' + c.source_version +
        (c.verbatim ? ' · 자구 일치' : ' · 자구 불일치')));
      cf.body.appendChild(el('p', null, c.divergence_ko));
      if (c.vulgate_parallel) cf.body.appendChild(el('p', 'par', c.vulgate_parallel));
      rows.appendChild(cf.root);
    });

    var unc = s.uncertain || [];
    if (unc.length) {
      var uf = fold('이문·미확정', unc.length);
      uf.body.className = 'body app';
      unc.forEach(function (u) {
        var it = el('div', 'item'), hd = el('div', 'hd');
        hd.appendChild(el('span', 'kind', KIND_KO[u.kind] || u.kind));
        hd.appendChild(el('span', 'sfx', u.surface));
        hd.appendChild(el('span', 'conf', u.confidence));
        it.appendChild(hd);
        it.appendChild(el('p', null, u.issue));
        var ul = el('ul', 'opts');
        u.options.forEach(function (o) {
          ul.appendChild(el('li', o === u.chosen ? 'pick' : null, o));
        });
        it.appendChild(ul);
        uf.body.appendChild(it);
      });
      rows.appendChild(uf.root);
    }

    sec.appendChild(rows);
    box.appendChild(sec);
  });

  // 바닥글
  var f = document.getElementById('foot');
  f.innerHTML = '';
  f.appendChild(el('p', null,
    '저본 ' + (M.sentences[0] || {}).source_version + ' · 스키마 ' + M.spec_ref +
    ' · 모든 문장이 verified:false입니다. 2차 검증 전이므로 학습용으로만 쓰십시오.'));

  wireWords();
  restore();
}

/* ─────────────────────────── 탭 사전 ─────────────────────────── */
function closeSheet() {
  document.getElementById('sheet').classList.remove('up');
  if (curBtn) { curBtn.classList.remove('on'); curBtn = null; }
}

function wireWords() {
  document.querySelectorAll('.w').forEach(function (b) {
    b.addEventListener('click', function () {
      if (curBtn === b) { closeSheet(); return; }
      var sid = b.dataset.s, i = +b.dataset.i, d = DICT[sid][i];
      if (curBtn) curBtn.classList.remove('on');
      curBtn = b; b.classList.add('on');
      document.getElementById('sf').textContent = d.s;
      document.getElementById('lemma').textContent = d.l ? '← ' + d.l : '';
      document.getElementById('dMorph').textContent = d.m;
      document.getElementById('dRole').textContent = d.r;
      document.getElementById('dGloss').textContent = d.g || '—';
      var w = document.getElementById('warn');
      var fl = (UNC[sid] || []).filter(function (u) { return u.i === i; });
      if (fl.length) {
        w.hidden = false;
        w.textContent = '⚠ ' + fl.map(function (u) { return u.k; }).join(' · ') + ' — 검증 전입니다.';
      } else { w.hidden = true; }
      document.getElementById('sheet').classList.add('up');
      put('last', sid);
      document.getElementById('resume').textContent = '이어 읽기 · ' + sid.replace('mk-1-', '절 ');
    });
  });
}
document.getElementById('x').addEventListener('click', closeSheet);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

/* ── 장음 강조 ── */
var lvBox = document.getElementById('lv');
function applyLv() {
  document.body.classList.toggle('lv-on', lvBox.checked);
  put('lv', lvBox.checked ? '1' : '0');
}
if (get('lv') === '1') lvBox.checked = true;
lvBox.addEventListener('change', applyLv);
applyLv();

/* ── 무손실 재개 (SPEC P0 #3) ── */
function restore() {
  var last = get('last');
  if (!last) return;
  document.getElementById('resume').textContent = '이어 읽기 · ' + last.replace('mk-1-', '절 ');
  var n = document.getElementById(last);
  if (n) n.scrollIntoView({ block: 'start' });
}

/* ─────────────────────────── 상태 화면 ─────────────────────────── */
function check(ok, title, detail) {
  var li = el('li', ok === true ? 'ok' : ok === false ? 'bad' : '');
  li.appendChild(el('span', 'dot'));
  var t = el('div');
  t.appendChild(el('div', 't', title));
  t.appendChild(el('div', 'd', detail));
  li.appendChild(t);
  return li;
}

function mb(n) { return (n / 1048576).toFixed(1) + ' MB'; }

function runChecks() {
  var box = document.getElementById('checks');
  box.innerHTML = '';
  var files = document.getElementById('files');
  files.innerHTML = '';

  // 1. 서비스 워커
  if (!('serviceWorker' in navigator)) {
    box.appendChild(check(false, '서비스 워커 없음',
      '이 브라우저는 서비스 워커를 지원하지 않습니다. 오프라인 동작이 불가능합니다.'));
  } else if (navigator.serviceWorker.controller) {
    box.appendChild(check(true, '서비스 워커 작동 중',
      '이 페이지는 서비스 워커가 넘겨준 것입니다. 오프라인 응답이 가능합니다.'));
  } else {
    box.appendChild(check(null, '서비스 워커 등록 대기',
      '등록은 되었으나 아직 이 페이지를 넘겨받지 않았습니다. 한 번 새로고침하십시오.'));
  }

  // 2. 캐시
  if (!('caches' in window)) {
    box.appendChild(check(false, '캐시 저장소 없음', 'Cache API를 쓸 수 없습니다.'));
  } else {
    caches.keys().then(function (keys) {
      if (!keys.length) {
        box.appendChild(check(false, '캐시 비어 있음', '아직 아무것도 저장되지 않았습니다.'));
        return;
      }
      return caches.open(keys[0]).then(function (c) { return c.keys(); }).then(function (reqs) {
        box.appendChild(check(reqs.length > 0, '캐시 ' + reqs.length + '개 파일',
          '캐시 이름 ' + keys.join(', ') + '. 아래 목록이 비행기 모드에서 열리는 파일입니다.'));
        reqs.forEach(function (r) {
          files.appendChild(el('li', null, r.url.replace(location.origin, '')));
        });
      });
    }).catch(function () {
      box.appendChild(check(false, '캐시 확인 실패', '저장소에 접근할 수 없습니다.'));
    });
  }

  // 3. 영구 저장 (SPEC 2장: iOS 캐시 축출 방지)
  if (!navigator.storage || !navigator.storage.persisted) {
    box.appendChild(check(null, '영구 저장 확인 불가',
      '이 브라우저는 persist API를 지원하지 않습니다. 캐시가 밀려날 수 있습니다.'));
  } else {
    navigator.storage.persisted().then(function (p) {
      box.appendChild(check(p, p ? '영구 저장 허용됨' : '영구 저장 미허용',
        p ? '저장 공간이 부족해도 이 앱의 캐시는 밀려나지 않습니다.'
          : '아래 버튼으로 요청하십시오. 허용되지 않으면 저장 공간이 부족할 때 캐시가 지워집니다.'));
    });
  }

  // 4. 사용량
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(function (e) {
      box.appendChild(check(null, '사용량 ' + mb(e.usage || 0),
        '할당 가능 ' + mb(e.quota || 0) + '. SPEC 예상은 모듈당 10~40MB, 전체 300MB 내외입니다.'));
    });
  }
}

document.getElementById('persist').addEventListener('click', function () {
  if (!navigator.storage || !navigator.storage.persist) {
    alert('이 브라우저는 영구 저장 요청을 지원하지 않습니다.');
    return;
  }
  navigator.storage.persist().then(function (ok) {
    alert(ok ? '영구 저장이 허용되었습니다.'
             : '거부되었습니다. 앱을 홈 화면에 추가한 뒤 다시 시도하면 허용될 가능성이 높습니다.');
    runChecks();
  });
});

document.getElementById('recheck').addEventListener('click', runChecks);

document.getElementById('nuke').addEventListener('click', function () {
  if (!confirm('서비스 워커를 해제하고 캐시를 모두 지웁니다. 계속할까요?')) return;
  var jobs = [];
  if ('caches' in window) {
    jobs.push(caches.keys().then(function (ks) {
      return Promise.all(ks.map(function (k) { return caches.delete(k); }));
    }));
  }
  if ('serviceWorker' in navigator) {
    jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) { return r.unregister(); }));
    }));
  }
  Promise.all(jobs).then(function () { location.reload(); });
});

/* ─────────────────────────── 부팅 ─────────────────────────── */
if (window.__MODULE) {
  // 단일 파일 빌드: 모듈이 이 파일 안에 들어 있다
  render(window.__MODULE);
} else {
  fetch(MODULE_URL)
  .then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(render)
  .catch(function (e) {
    document.getElementById('verses').innerHTML =
      '<p class="loading">모듈을 열지 못했습니다 — ' + e.message +
      '<br>정적 서버로 열었는지 확인하십시오. 파일을 직접 여는 file:// 방식으로는 동작하지 않습니다.</p>';
  });
}
